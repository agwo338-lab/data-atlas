<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="data/sites.js"></script>
<script src="data/providers.js"></script>
<script src="data/news.js"></script>
<script src="data/sources.js"></script>

<style>
  /* ════════════════════════════════════════════════════════════════════
     Graphite tokens — this page always renders dark, regardless of OS/
     browser setting. Warm-neutral near-blacks, one bone accent; the
     operator colours in data/providers.js are the only saturated hue on
     screen. Kept inline since the project has no build step (see
     CLAUDE.md). tools/desk-app/ carries a copy of these — mirror changes.
     ════════════════════════════════════════════════════════════════ */
  :root{
    --color-map:#0c0c0e;        /* the map field and the page ground */
    --color-bg:#131315;         /* panels */
    --color-surface:#19191c;    /* raised: inputs, tiles, hover */
    --color-surface-3:#202024;  /* active: selected row, pressed seg */
    --color-rail:#0f0f11;
    --color-text:#ebe9e4;
    --color-accent:#e6dfd0;
    --color-accent-2:#d9cfba;
    --color-divider:rgba(255,255,255,.07);
    --color-divider-strong:rgba(255,255,255,.13);

    --color-neutral-100:#f4f2ec; --color-neutral-200:#e6e3dc; --color-neutral-300:#cfccc4;
    --color-neutral-400:#a3a19b; --color-neutral-500:#86847f; --color-neutral-600:#6b6964;
    --color-neutral-700:#4f4e4a; --color-neutral-800:#38383a; --color-neutral-900:#26262a;

    --color-accent-100:#faf8f3; --color-accent-200:#f3efe6; --color-accent-300:#f5f1e8;
    --color-accent-400:#ece5d6; --color-accent-500:#e6dfd0; --color-accent-600:#b9b1a2;
    --color-accent-700:#8d8678; --color-accent-800:#5c574e; --color-accent-900:#3a3731;

    --font-heading:"Geist", system-ui, sans-serif;
    --font-body:"Geist", system-ui, sans-serif;
    --font-code:"Geist Mono", ui-monospace, monospace;

    /* Layout: an icon rail, one docked panel, the map, and an inspector
       that overlays the map's right edge when a site is selected. */
    --rail-w:56px;
    --panel-w:400px;
    --inspector-w:392px;
    --status-h:28px;

    --space-1:2px; --space-2:4px; --space-3:8px; --space-4:12px; --space-6:16px; --space-8:20px;
    --radius-sm:6px; --radius-md:8px; --radius-lg:12px;
    --shadow-md:0 8px 24px rgba(0,0,0,.5);
    --shadow-lg:0 16px 40px rgba(0,0,0,.6);

    /* Compat aliases — the Sources & method page, the site page and the
       pipeline SVG's inline <style> were written against these names. */
    --bg: var(--color-bg);
    --surface: var(--color-surface);
    --surface-2: var(--color-surface);
    --border: var(--color-divider-strong);
    --ink: var(--color-text);
    --ink-soft: var(--color-neutral-400);
    --accent: var(--color-accent);
    --accent-soft: color-mix(in srgb, var(--color-accent) 14%, transparent);
    --radius: var(--radius-md);
    --font-sans: var(--font-body);
    --font-mono: var(--font-code);
  }

  *, *::before, *::after{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html, body{ height:100%; }
  body{
    margin:0; overflow:hidden;
    background:var(--color-map); color:var(--color-text);
    font-family:var(--font-body); font-size:13px; line-height:1.45;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--ink); }
  a{ color:var(--color-text); text-decoration:none; }
  a:hover{ color:#ffffff; }
  button{ font:inherit; color:inherit; cursor:pointer; }
  h1,h2,h3,h4{ font-family:var(--font-heading); font-weight:600; letter-spacing:-0.02em; margin:0; }
  .mono{ font-family:var(--font-code); font-variant-numeric:tabular-nums; }
  .eyebrow{ font-family:var(--font-code); font-size:10.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--color-neutral-500); }
  .stat-sub{ font-size:12px; color:var(--color-neutral-500); margin-top:var(--space-2); }
  .scroll{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; }
  .scroll::-webkit-scrollbar, .ov::-webkit-scrollbar, #detail::-webkit-scrollbar{ width:8px; }
  .scroll::-webkit-scrollbar-thumb, .ov::-webkit-scrollbar-thumb, #detail::-webkit-scrollbar-thumb{ background:#2a2a2f; border-radius:4px; }

  #shell{ position:relative; height:100vh; min-height:520px; }

  /* ---- map ----
     The map is a real region of the page, not the page itself: it starts
     where the panel ends, so fitBounds and centring need no compensation
     for chrome sitting on top of it. The inspector is the one thing that
     overlays it, and flyTo offsets for that. */
  #mapwrap{ position:absolute; top:0; bottom:0; left:calc(var(--rail-w) + var(--panel-w)); right:0; }
  /* ---- sky ----
     The globe's canvas is transparent everywhere outside the sphere, and its
     atmosphere shader blends into whatever is behind it — so a layer under
     the map reads as the space the globe is sitting in, halo and all. Two
     very restrained neutral washes keep it from being a flat black rectangle;
     the old blue and teal washes are what made the page read as navy. */
  #sky{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:
      radial-gradient(60% 55% at 22% 14%, rgba(230,223,208,.045) 0%, transparent 70%),
      radial-gradient(52% 48% at 86% 84%, rgba(255,255,255,.03) 0%, transparent 72%),
      radial-gradient(120% 90% at 50% 45%, #111113 0%, #0b0b0d 55%, #060607 100%);
  }
  #starfield{ position:absolute; inset:0; display:block; width:100%; height:100%; }
  /* Positioned so it paints above #sky, but no z-index of its own: the scale
     and attribution controls inside it have to outrank the status strip. */
  #map{ position:relative; width:100%; height:100%; display:block; background:transparent; }
  .map-loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    margin:0; font-family:var(--font-code); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--color-neutral-500);
    pointer-events:none;
  }
  .maplibregl-ctrl-attrib{ font-size:10px !important; font-family:var(--font-code) !important; background:transparent !important; color:var(--color-neutral-500) !important; padding:0 !important; }
  .maplibregl-ctrl-attrib a{ color:var(--color-neutral-500) !important; }
  .maplibregl-ctrl-bottom-right{ bottom:0 !important; right:16px !important; height:var(--status-h); display:flex; align-items:center; z-index:3; }
  .maplibregl-ctrl-bottom-right .maplibregl-ctrl{ margin:0 !important; }
  .maplibregl-ctrl-bottom-left{ bottom:0 !important; left:16px !important; height:var(--status-h); display:flex; align-items:center; z-index:3; }
  .maplibregl-ctrl-bottom-left .maplibregl-ctrl{ margin:0 !important; }
  .maplibregl-ctrl-scale{
    background:transparent !important; border:1px solid var(--color-neutral-500) !important; border-top:0 !important;
    color:var(--color-neutral-500) !important; font:10.5px var(--font-code) !important; padding:0 5px 1px !important; height:auto !important; line-height:1 !important;
  }
  .maplibregl-ctrl-attrib-button{ display:none !important; }

  /* Bottom status strip — counts, scale and attribution, the way a GIS
     viewer carries them. The scale and attribution controls are MapLibre's
     own, positioned into this band above. */
  .statusbar{
    position:absolute; left:0; right:0; bottom:0; height:var(--status-h); z-index:2;
    display:flex; align-items:center; gap:14px; padding:0 330px 0 120px;
    background:rgba(12,12,14,.85); border-top:1px solid var(--color-divider);
    font-family:var(--font-code); font-size:10.5px; color:var(--color-neutral-500); white-space:nowrap; overflow:hidden;
    pointer-events:none;
  }
  .statusbar span{ overflow:hidden; text-overflow:ellipsis; }

  /* Floating map controls, top right. */
  .map-tools{
    position:absolute; top:16px; right:16px; z-index:4; display:flex; flex-direction:column;
    background:var(--color-bg); border:1px solid var(--color-divider-strong); border-radius:10px; overflow:hidden; box-shadow:var(--shadow-md);
  }
  .map-tools button{ width:36px; height:36px; display:flex; align-items:center; justify-content:center; border:0; background:transparent; color:var(--color-neutral-400); }
  .map-tools button + button{ border-top:1px solid var(--color-divider); }
  .map-tools button:hover{ color:var(--color-text); background:var(--color-surface-3); }
  .map-tools svg, #rail svg, .field svg, .ghost svg, .primary svg, .back-link svg, .iconbtn svg{ width:16px; height:16px; flex:none; }

  .legend{
    position:absolute; right:16px; bottom:calc(var(--status-h) + 16px); z-index:4;
    padding:12px 14px; background:var(--color-bg); border:1px solid var(--color-divider-strong); border-radius:10px; box-shadow:var(--shadow-md);
    display:flex; flex-direction:column; gap:8px; font-size:11.5px; color:var(--color-neutral-400);
  }
  .legend div{ display:flex; align-items:center; gap:8px; }
  .legend hr{ border:0; height:1px; margin:2px 0; background:var(--color-divider); }
  .legend .dim{ color:var(--color-neutral-500); }
  .lg{ width:10px; height:10px; border-radius:50%; flex:none; }
  .lg.s-operational{ background:var(--color-neutral-400); }
  .lg.s-under-construction{ border:1.5px solid var(--color-neutral-400); }
  .lg.s-planned{ border:1.5px dashed var(--color-neutral-500); }
  .lg-sizes{ display:inline-flex; align-items:center; gap:3px; }
  .lg-sizes i{ display:block; border-radius:50%; background:var(--color-neutral-500); }

  /* ---- icon rail ---- */
  #rail{
    position:absolute; z-index:30; top:0; bottom:0; left:0; width:var(--rail-w);
    background:var(--color-rail); border-right:1px solid var(--color-divider);
    display:flex; flex-direction:column; align-items:center; padding:12px 0; gap:4px;
  }
  .rail-mark{ width:32px; height:32px; border-radius:8px; background:var(--color-surface-3); box-shadow:inset 0 0 0 1px var(--color-divider-strong); display:flex; align-items:center; justify-content:center; margin-bottom:14px; color:var(--color-text); }
  #rail button{ width:40px; height:40px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:0; background:transparent; color:var(--color-neutral-500); }
  #rail button:hover{ color:var(--color-text); background:var(--color-surface); }
  #rail button[aria-current="true"]{ background:var(--color-surface-3); color:var(--color-text); box-shadow:inset 0 0 0 1px var(--color-divider-strong); }
  .rail-gap{ flex:1; }

  /* ---- the panel ---- */
  #panel{
    position:absolute; z-index:20; top:0; bottom:0; left:var(--rail-w); width:var(--panel-w);
    background:var(--color-bg); border-right:1px solid var(--color-divider-strong);
    display:flex; flex-direction:column;
  }
  .panel-head{ padding:18px 20px 14px; display:flex; flex-direction:column; gap:12px; border-bottom:1px solid var(--color-divider); flex:none; }
  .brand-row{ display:flex; align-items:baseline; justify-content:space-between; }
  .brand{ font-size:17px; font-weight:600; letter-spacing:-.02em; line-height:1; }
  .panel-view{ flex:1; min-height:0; display:flex; flex-direction:column; }
  .panel-foot{ flex:none; padding:10px 20px 14px; border-top:1px solid var(--color-divider); display:flex; align-items:center; justify-content:space-between; font-size:11.5px; color:var(--color-neutral-500); }

  .seg{ display:inline-flex; padding:3px; border-radius:8px; background:var(--color-surface); box-shadow:inset 0 0 0 1px var(--color-divider); }
  .seg button{ border:0; background:transparent; padding:5px 12px; border-radius:6px; font-size:12px; font-weight:500; color:var(--color-neutral-500); }
  .seg.wide{ display:flex; } .seg.wide button{ flex:1; }
  .seg button[aria-pressed="true"]{ background:var(--color-surface-3); color:var(--color-text); box-shadow:0 1px 2px rgba(0,0,0,.4), inset 0 0 0 1px var(--color-divider-strong); }
  .seg button:not([aria-pressed="true"]):hover{ color:var(--color-text); }

  .field{ display:flex; align-items:center; gap:8px; height:34px; padding:0 12px; border-radius:8px; background:var(--color-surface); box-shadow:inset 0 0 0 1px var(--color-divider-strong); color:var(--color-neutral-500); }
  .field:focus-within{ box-shadow:inset 0 0 0 1px var(--color-accent-600); }
  .field input{ flex:1; border:0; background:transparent; color:var(--color-text); font:inherit; outline:none; min-width:0; }
  .field input::placeholder{ color:var(--color-neutral-500); }

  .ghost{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 12px; border-radius:8px; border:0; background:var(--color-surface); box-shadow:inset 0 0 0 1px var(--color-divider-strong); color:var(--color-text); font-size:12.5px; font-weight:500; white-space:nowrap; }
  .ghost:hover{ background:var(--color-surface-3); }
  .ghost.sm{ height:28px; padding:0 10px; font-size:12px; }
  .primary{ display:inline-flex; align-items:center; gap:8px; height:32px; padding:0 14px; border-radius:8px; border:0; background:var(--color-accent); color:#121212; font-size:12.5px; font-weight:600; white-space:nowrap; }
  .primary:hover{ background:#ffffff; }
  .iconbtn{ width:32px; height:32px; display:flex; align-items:center; justify-content:center; border-radius:8px; border:0; background:transparent; color:var(--color-neutral-500); }
  .iconbtn:hover{ color:var(--color-text); background:var(--color-surface); }
  .chip{ display:inline-flex; align-items:center; gap:6px; height:22px; padding:0 8px; border-radius:6px; font-size:11.5px; font-weight:500; background:var(--color-surface); box-shadow:inset 0 0 0 1px var(--color-divider); color:var(--color-neutral-400); white-space:nowrap; }

  /* ---- status glyphs: the map's pin treatments, reused everywhere ---- */
  .sg{ width:9px; height:9px; border-radius:50%; flex:none; display:inline-block; --c:var(--color-neutral-400); }
  .sg.s-operational{ background:var(--c); }
  .sg.s-under-construction{ border:1.5px solid var(--c); }
  .sg.s-planned{ border:1.5px dashed var(--c); opacity:.85; }

  /* ---- capacity pictogram: one rack per unit of MW, one hoverable
     segment per status, tinted by status the way the pins are ---- */
  .racks{ display:flex; flex-wrap:wrap; gap:2px; --pc:var(--color-neutral-400); }
  .capseg{ position:relative; display:inline-flex; flex-wrap:wrap; gap:2px; border-radius:3px; }
  .rack{ width:9px; height:13px; display:block; transition:filter .12s ease; }
  .rack rect{ fill:var(--pc); stroke:var(--pc); }
  .rack path{ stroke:var(--color-bg); stroke-width:1; stroke-linecap:round; fill:none; }
  .capseg.s-under-construction .rack rect{ fill-opacity:.5; }
  .capseg.s-planned .rack rect{ fill-opacity:.22; stroke-opacity:.55; }
  .capseg:hover .rack{ filter:brightness(1.5) saturate(1.1); }
  .capseg .tip{
    display:none; position:absolute; left:0; bottom:calc(100% + 7px); z-index:6; white-space:nowrap; align-items:baseline; gap:6px;
    padding:5px 8px; border-radius:6px; background:var(--color-surface-3); box-shadow:0 0 0 1px var(--color-divider-strong), 0 6px 16px rgba(0,0,0,.5);
    font-size:11px; color:var(--color-text); pointer-events:none;
  }
  .capseg .tip::after{ content:""; position:absolute; left:10px; top:100%; border:5px solid transparent; border-top-color:var(--color-surface-3); }
  .capseg .tip b{ font-weight:600; }
  .capseg .tip span{ font-family:var(--font-code); color:var(--color-neutral-400); }
  .capseg:hover .tip{ display:inline-flex; }
  .racks-key{ display:inline-flex; align-items:center; gap:6px; }
  .racks-key .rack{ width:8px; height:11px; }
  .racks-key .rack rect{ fill:var(--color-neutral-500); stroke:var(--color-neutral-500); }

  /* ---- operators list ---- */
  .list-head{ display:flex; align-items:center; justify-content:space-between; padding:14px 20px 8px; flex:none; }
  #provList{ padding:0 10px 10px; display:flex; flex-direction:column; gap:2px; }
  .prov{
    display:grid; grid-template-columns:10px 1fr auto; align-items:center; column-gap:10px; row-gap:6px;
    padding:12px 10px; border-radius:8px; border:0; background:transparent; text-align:left; width:100%; color:inherit;
  }
  .prov:hover{ background:var(--color-surface); }
  .prov[aria-expanded="true"]{ background:var(--color-surface-3); box-shadow:inset 0 0 0 1px var(--color-divider-strong); }
  .prov .dot{ width:9px; height:9px; border-radius:50%; }
  .prov .pname{ font-size:13.5px; font-weight:500; }
  .prov .pmw{ font-family:var(--font-code); font-size:12px; color:var(--color-neutral-400); font-variant-numeric:tabular-nums; }
  .prov .racks, .prov .pcount, .prov .pnone{ grid-column:2 / span 2; }
  .prov .pcount{ font-size:11.5px; color:var(--color-neutral-500); }
  .prov .pnone{ font-size:11.5px; color:var(--color-neutral-600); font-style:italic; }

  /* ---- site rows: the Sites tab and the operator page share them ---- */
  .rows{ padding:4px 10px 10px; display:flex; flex-direction:column; gap:1px; }
  .site-row{
    display:grid; grid-template-columns:14px 1fr 64px 18px; align-items:center; column-gap:10px;
    padding:9px 10px; border-radius:6px; border:0; background:transparent; text-align:left; width:100%; color:inherit;
  }
  .site-row:hover{ background:var(--color-surface); }
  .site-row[aria-selected="true"]{ background:var(--color-surface-3); box-shadow:inset 0 0 0 1px var(--color-divider-strong); }
  .sr-main{ display:flex; flex-direction:column; min-width:0; }
  .sr-name{ font-size:13px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sr-sub{ font-size:11.5px; color:var(--color-neutral-500); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sr-mw{ font-family:var(--font-code); font-size:12px; text-align:right; font-variant-numeric:tabular-nums; }
  .sr-mw.none{ color:var(--color-neutral-500); }
  .sr-tick{ width:3px; height:12px; border-radius:1px; display:block; justify-self:center; background:#5a5955; }
  .sr-tick.independent{ background:var(--color-accent); }
  .sr-tick.unsourced{ background:repeating-linear-gradient(to bottom, #5a5955 0 2px, transparent 2px 4px); }
  .sites-head{ padding:12px 20px 4px; display:flex; flex-direction:column; gap:10px; flex:none; }
  .sites-filters{ display:flex; align-items:center; justify-content:space-between; }
  .rows-empty{ padding:24px 10px; font-size:12.5px; color:var(--color-neutral-500); text-align:center; }

  /* Verdict, stated in words where it still appears (site page, method page). */
  .vd{ display:inline-flex; align-items:center; gap:7px; font-size:12px; white-space:nowrap; }
  .vd i{ width:3px; height:12px; flex:none; display:block; border-radius:1px; }
  .vd.independent{ color:var(--color-text); } .vd.independent i{ background:var(--color-accent); }
  .vd.operator{ color:var(--color-neutral-400); } .vd.operator i{ background:#5a5955; }
  .vd.unsourced{ color:var(--color-neutral-500); } .vd.unsourced i{ background:repeating-linear-gradient(to bottom, #5a5955 0 2px, transparent 2px 4px); }

  /* ---- operator page (inside the panel) ---- */
  .op-nav{ display:flex; align-items:center; justify-content:space-between; padding:12px 20px 0; }
  .back-link{ display:inline-flex; align-items:center; gap:4px; background:none; border:0; padding:0; font-size:12px; color:var(--color-neutral-500); }
  .back-link:hover{ color:var(--color-text); }
  .op-head{ padding:14px 20px 0; display:flex; flex-direction:column; gap:10px; }
  .op-ident{ display:flex; align-items:center; gap:12px; }
  .op-logo{ width:40px; height:40px; border-radius:10px; background:#ffffff; box-shadow:inset 0 0 0 1px var(--color-divider-strong); display:flex; align-items:center; justify-content:center; flex:none; overflow:hidden; }
  .op-logo img{ width:26px; height:26px; display:block; }
  .op-logo.fallback{ background:var(--color-surface-3); color:var(--color-text); font-weight:600; font-size:15px; }
  .op-ident h1{ font-size:22px; line-height:1.1; }
  .op-meta{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--color-neutral-500); }
  .op-meta .dot{ width:8px; height:8px; border-radius:50%; }
  .p-summary{ margin:0; font-size:12.5px; line-height:1.5; color:var(--color-neutral-400); }
  .p-figure{ padding:18px 20px 0; display:flex; flex-direction:column; gap:10px; }
  .p-cap{ display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 8px; }
  .p-cap .eyebrow{ white-space:nowrap; }
  .p-cap b{ font:500 36px/1 var(--font-code); letter-spacing:-.02em; font-variant-numeric:tabular-nums; }
  .p-cap-meta{ flex-basis:100%; font-size:11.5px; color:var(--color-neutral-500); }
  .racks-legend{ display:flex; flex-wrap:wrap; align-items:center; gap:12px; font-size:11px; color:var(--color-neutral-500); }
  .racks-legend span{ display:inline-flex; align-items:center; gap:4px; }
  .racks-legend .rack{ width:8px; height:11px; }
  .tiles{ display:flex; flex-wrap:wrap; gap:8px; }
  .tile{ flex:1 1 100px; display:flex; flex-direction:column; gap:4px; padding:10px 10px; background:var(--color-surface); border-radius:8px; box-shadow:inset 0 0 0 1px var(--color-divider); min-width:0; }
  .tile .eyebrow{ display:inline-flex; align-items:center; gap:5px; letter-spacing:.06em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile b{ font:500 18px/1.1 var(--font-code); font-variant-numeric:tabular-nums; white-space:nowrap; }

  .partner-relationship{ display:block; font-family:var(--font-code); font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--color-neutral-500); margin-top:2px; }
  .partner-detail{ margin:.3rem 0 0; font-size:12px; color:var(--color-neutral-400); line-height:1.5; }
  .partner-meta{ display:block; margin-top:.35rem; font-size:11px; color:var(--color-neutral-500); }

  .partner-meta a, .headline-meta a{ color:var(--color-neutral-500); }

  .headline-list{ list-style:none; margin:0; padding:0; }

  .headline-category{ letter-spacing:.06em; text-transform:uppercase; }
  .headline-title{ display:block; color:var(--color-text); font-weight:500; }
  .headline-why{ margin:.25rem 0 0; color:var(--color-neutral-400); font-size:12px; line-height:1.5; }
  .headline-meta{ display:block; margin-top:.3rem; font-size:11px; color:var(--color-neutral-500); }
  .p-search-link{ display:inline-block; margin-top:4px; font-size:12px; color:var(--color-neutral-400); }

  /* ---- site inspector ---- */
  #detail{
    position:absolute; z-index:28; top:0; right:0; bottom:0; width:var(--inspector-w);

    display:none; flex-direction:column;
  }

  .d-top{ padding:14px 16px 0 20px; display:flex; align-items:center; justify-content:space-between; flex:none; }
  .d-op{ display:inline-flex; align-items:center; gap:8px; font-family:var(--font-code); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--color-neutral-400); background:none; border:0; padding:0; }

  .d-body{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden; display:flex; flex-direction:column; }
  .d-head{ padding:8px 20px 0; display:flex; flex-direction:column; gap:6px; }
  .d-title{ font-size:22px; line-height:1.15; }

  .d-coords{ font-family:var(--font-code); font-size:11px; color:var(--color-neutral-500); }
  .d-chips{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .d-figure{ margin:18px 20px 0; padding:14px 16px; background:var(--color-surface); border-radius:10px; box-shadow:inset 0 0 0 1px var(--color-divider); display:flex; flex-direction:column; gap:6px; }
  .d-figure .p-cap b{ font-size:34px; }
  .d-figure .racks{ margin-top:6px; }
  .d-figure .cap-note{ font-size:11px; color:var(--color-neutral-500); }
  .d-figure .cap-none{ font-size:12.5px; color:var(--color-neutral-500); }
  .d-section{ padding:18px 20px 0; display:flex; flex-direction:column; gap:6px; }
  .d-section:last-child{ padding-bottom:20px; }
  .d-notes{ margin:0; font-size:12.5px; line-height:1.55; color:var(--color-neutral-400); white-space:pre-line;
    display:-webkit-box; -webkit-line-clamp:7; -webkit-box-orient:vertical; overflow:hidden; }
  .d-notes.open{ display:block; -webkit-line-clamp:unset; }
  .d-more{ align-self:flex-start; background:none; border:0; padding:0; font-size:12px; color:var(--color-neutral-500); }
  .d-more:hover{ color:var(--color-text); }
  .src{ display:grid; grid-template-columns:22px 1fr; gap:10px; align-items:start; padding:7px 0; border-top:1px solid var(--color-divider); font-size:12px; line-height:1.4; }
  .src:last-child{ border-bottom:1px solid var(--color-divider); }
  .src .cls{ margin-top:1px; }
  .src .sm{ display:block; margin-top:2px; font-family:var(--font-code); font-size:10.5px; color:var(--color-neutral-500); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cls{ font:500 10px/16px var(--font-code); text-align:center; border:1px solid var(--color-neutral-700); color:var(--color-neutral-300); border-radius:4px; display:inline-block; min-width:18px; }
  .cls.ind{ border-color:var(--color-accent-600); color:var(--color-accent-300); }
  .d-foot{ flex:none; padding:12px 20px 16px; border-top:1px solid var(--color-divider); display:flex; gap:8px; }

  .basis-tag{ font-family:var(--font-code); font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--color-neutral-500); }
  .basis-tag.basis-derived, .basis-tag.basis-estimated{ color:#d9b45a; }

  .status-pill{ display:inline-flex; align-items:center; gap:.45rem; font:500 12px var(--font-heading); }
  .status-pill::before{ content:""; width:8px; height:8px; border-radius:50%; flex-shrink:0; box-sizing:border-box; }
  .status-pill.status-operational::before{ background:currentColor; }
  .status-pill.status-under-construction::before{ border:1.5px solid currentColor; }
  .status-pill.status-planned::before{ border:1.5px dashed currentColor; opacity:.85; }

  /* ---- confidence dot (hover-revealed graded level, beside the verdict) — method page & site page ---- */
  .conf-badge{
    display:inline-flex; align-items:center;
    height:15px; padding:0 3px; border-radius:999px;
    vertical-align:middle; cursor:help;
    background:transparent; border:1px solid transparent;
    color:var(--conf-fg);
    transition:background .16s ease, border-color .16s ease, padding .16s ease;
  }
  .conf-badge::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; flex:0 0 auto; }
  .conf-badge .conf-label{ max-width:0; opacity:0; margin-left:0; overflow:hidden; white-space:nowrap; font-size:.66rem; font-weight:600; letter-spacing:.02em; transition:max-width .18s ease, opacity .14s ease, margin-left .18s ease; }
  .conf-badge:hover, .conf-badge:focus-visible{ background:var(--conf-bg); border-color:var(--conf-bd); padding:0 .5rem 0 .35rem; }
  .conf-badge:hover .conf-label, .conf-badge:focus-visible .conf-label{ max-width:7rem; opacity:1; margin-left:.32rem; }
  .conf-badge:focus-visible{ outline:1px solid var(--conf-bd); outline-offset:2px; }

  /* ---- provider tag ---- */
  .provider-tag{ font:600 11px var(--font-heading); letter-spacing:.05em; text-transform:uppercase; padding:.22rem .55rem; border-radius:5px; color:#121212; white-space:nowrap; }

  /* ---- pins ---- */
  .pin-marker{ width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .pin-marker.dim{ display:none; }
  .pin-core{ border-radius:50%; transition:transform .15s ease; box-sizing:border-box; }
  .pin-marker.pin-status-operational .pin-core{ background:var(--dot); border:1.5px solid var(--color-map); }
  .pin-marker.pin-status-under-construction .pin-core{ background:color-mix(in srgb, var(--dot) 22%, transparent); border:1.6px solid var(--dot); }
  .pin-marker.pin-status-planned .pin-core{ background:color-mix(in srgb, var(--dot) 10%, transparent); border:1.4px dashed var(--dot); }
  .pin-marker:hover .pin-core, .pin-marker:focus .pin-core, .pin-marker.active .pin-core{ transform:scale(1.22); }
  .pin-halo{ position:absolute; width:100%; height:100%; border-radius:50%; background:var(--dot); opacity:0; transition:opacity .15s ease; pointer-events:none; }
  .pin-marker:hover .pin-halo, .pin-marker:focus .pin-halo{ opacity:.2; }
  .pin-marker.active .pin-halo{ opacity:0; }
  .pin-ring{ position:absolute; border-radius:50%; border:1.5px solid var(--color-accent); opacity:0; pointer-events:none; transition:opacity .15s ease; }
  .pin-marker.active .pin-ring{ opacity:1; }
  .pin-marker:hover, .pin-marker:focus, .pin-marker.active{ z-index:10; }
  .pin-pulse{ position:absolute; border-radius:50%; border:2px solid var(--dot); opacity:0; pointer-events:none; }
  .pin-marker.pin-status-operational .pin-pulse{ animation:pin-pulse 2.4s cubic-bezier(.2,.6,.4,1) infinite; }
  @keyframes pin-pulse{ 0%{ transform:scale(1); border-width:3px; opacity:.5; } 100%{ transform:scale(2.4); border-width:.5px; opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .pin-marker.pin-status-operational .pin-pulse{ animation:none; display:none; } }
  .pin-label{
    position:absolute; bottom:calc(100% - 2px); left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:flex-start; gap:1px;
    padding:6px 9px; border-radius:6px; background:var(--color-bg); border:1px solid var(--color-divider-strong); box-shadow:0 6px 18px rgba(0,0,0,.5);
    white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s ease; z-index:5;
  }
  .pin-marker:hover .pin-label, .pin-marker:focus .pin-label{ opacity:1; }
  .pin-label-name{ font-size:11.5px; font-weight:500; color:var(--color-text); line-height:1.2; }
  .pin-label-cap{ font-family:var(--font-code); font-size:10.5px; color:var(--color-neutral-500); line-height:1.2; }

  /* ---- full-screen overlay views (Sources & method / site page) ----
     They sit to the right of the rail, so the rail stays the way back. */
  .ov{ position:absolute; top:0; bottom:0; left:var(--rail-w); right:0; z-index:40; background:var(--color-bg); overflow-y:auto; display:none; padding:56px 40px 96px; }
  .ov.on{ display:block; }
  .wrap{ max-width:1040px; margin:0 auto; }
  .lede{ font-size:14px; line-height:1.6; color:var(--color-neutral-300); max-width:66ch; }
  .ov .back-link{ margin-bottom:20px; }
  .plink{ cursor:pointer; }
  .plink:hover{ color:#ffffff; text-decoration:underline; }

  .tally{ display:flex; align-items:baseline; gap:12px; margin:20px 0 12px; flex-wrap:wrap; }
  .tally b{ font:500 56px/1 var(--font-code); letter-spacing:-.035em; }
  .tally span{ font-size:14px; color:var(--color-neutral-400); max-width:34ch; }
  .meter{ display:flex; height:6px; max-width:620px; margin-bottom:8px; border-radius:3px; overflow:hidden; }
  .meter i:nth-child(1){ background:var(--color-accent); }
  .meter i:nth-child(2){ background:var(--color-neutral-700); }
  .meter i:nth-child(3){ background:repeating-linear-gradient(to right, var(--color-neutral-800) 0 3px, transparent 3px 6px); }

  .band{ margin:56px 0 20px; }
  .band h4{ font-size:20px; margin-bottom:4px; }
  .band p{ color:var(--color-neutral-400); font-size:13px; max-width:70ch; margin:0; }

  .classes{ display:grid; gap:0; margin-top:16px; }
  .cl{ display:grid; grid-template-columns:26px 200px 1fr; gap:16px; align-items:baseline; padding:12px 0; border-top:1px solid var(--color-divider); }
  .cl .code{ font:500 12px/22px var(--font-code); text-align:center; border:1px solid var(--color-neutral-700); color:var(--color-neutral-300); border-radius:4px; }
  .cl.ind .code{ border-color:var(--color-accent-600); color:var(--color-accent-300); }
  .cl .lab{ font:500 14px var(--font-heading); }
  .cl .bl{ font-size:12.5px; color:var(--color-neutral-400); }

  table.table{ width:100%; border-collapse:collapse; font-size:13px; margin-top:12px; }
  table.table th{ text-align:left; font:500 10.5px var(--font-code); letter-spacing:.08em; text-transform:uppercase; color:var(--color-neutral-500); padding:4px 8px 6px 0; border-bottom:1px solid var(--color-divider-strong); }
  table.table td{ padding:8px 8px 8px 0; vertical-align:top; border-bottom:1px solid var(--color-divider); }
  table.table tbody tr:hover td{ background:color-mix(in srgb, var(--color-text) 3%, transparent); }
  .ch-name{ font-weight:500; }
  .ch-gives{ color:var(--color-neutral-400); font-size:12.5px; line-height:1.5; max-width:44ch; }
  .ch-meta{ font-size:12px; color:var(--color-neutral-400); white-space:nowrap; }
  .cls-cell{ width:26px; }

  .rule-list{ list-style:none; margin:12px 0 0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .rule-list li{ display:grid; grid-template-columns:6.5rem 1fr; gap:16px; align-items:baseline;
    background:var(--color-surface); border:1px solid var(--color-divider); border-radius:8px; padding:8px 12px;
    font-size:12.5px; line-height:1.55; color:var(--color-neutral-400); }
  .rule-list li strong{ color:var(--color-text); }

  .tally-row{ display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 0; }
  .tally-card{ background:var(--color-surface); border:1px solid var(--color-divider); border-top:2px solid var(--tc); border-radius:8px; padding:8px 12px; min-width:8.5rem; }
  .tally-value{ font:500 26px var(--font-code); color:var(--tc); }
  .tally-label{ font-size:11.5px; color:var(--color-neutral-500); margin-top:2px; }

  .method-figure{ background:var(--color-surface); border:1px solid var(--color-divider); border-radius:var(--radius-lg); padding:20px; overflow-x:auto; margin-top:12px; }
  .method-figure svg{ display:block; min-width:940px; width:100%; height:auto; }

  /* ---- site page ---- */
  .s-head{ display:flex; align-items:flex-start; gap:12px; }
  .s-head h1{ font-size:26px; }
  .s-sub{ margin:4px 0 0; color:var(--color-neutral-400); font-size:13px; }
  .s-head .provider-tag{ margin-left:auto; flex-shrink:0; }
  .s-facts{ display:flex; flex-wrap:wrap; gap:16px 20px; padding:12px 16px; margin:16px 0 20px;
    background:var(--color-surface); border:1px solid var(--color-divider); border-radius:var(--radius-lg); }
  .fact-label{ font-family:var(--font-code); font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--color-neutral-500); }
  .fact-value{ margin-top:.3rem; font-size:14px; }
  .fact-muted{ color:var(--color-neutral-500); }
  .s-block{ margin-bottom:20px; }
  .s-block h2{ font-size:14px; font-weight:600; margin-bottom:8px; }
  .s-prose{ max-width:70ch; font-size:13.5px; line-height:1.68; color:var(--color-text); white-space:pre-line; }
  .src-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .src-list li{ display:grid; grid-template-columns:22px 1fr; gap:12px; align-items:start; padding:8px 0; border-top:1px solid var(--color-divider); font-size:13px; line-height:1.45; }
  .src-list li:first-child{ border-top:0; }
  .src-meta{ margin-top:2px; font-size:11px; color:var(--color-neutral-500); }

  .site-disclosure{ border:1px solid var(--color-divider); border-radius:var(--radius-lg); background:var(--color-surface); }
  .site-disclosure > summary{ display:flex; align-items:center; gap:8px; padding:12px; cursor:pointer; list-style:none; font-size:13px; font-weight:600; }
  .site-disclosure > summary::-webkit-details-marker{ display:none; }
  .site-disclosure > summary:hover{ color:#ffffff; }
  .disc-chevron{ color:var(--color-neutral-500); transition:transform .16s ease; display:inline-block; }
  .site-disclosure[open] .disc-chevron{ transform:rotate(90deg); }
  .disc-body{ padding:0 12px 4px; border-top:1px solid var(--color-divider); }
  .disc-block{ padding:12px 0; border-bottom:1px solid var(--color-divider); }
  .disc-block:last-child{ border-bottom:0; }
  .disc-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .disc-field{ font-family:var(--font-code); font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--color-neutral-500); min-width:5rem; }
  .disc-blurb{ margin:.45rem 0 0; font-size:12.5px; line-height:1.55; color:var(--color-neutral-400); max-width:68ch; }
  .disc-lift{ margin:.5rem 0 0; font-size:12.5px; line-height:1.55; color:var(--color-neutral-400); max-width:68ch; }
  .disc-lift strong{ color:var(--color-text); font-weight:600; }
  .disc-hint{ margin:.55rem 0 0; padding:.5rem .65rem; border-left:2px solid color-mix(in srgb, var(--color-accent) 35%, transparent);
    background:color-mix(in srgb, var(--color-accent) 6%, transparent); border-radius:0 6px 6px 0; font-size:11.5px; line-height:1.5; color:var(--color-neutral-400); max-width:68ch; }
  .verdict-inline{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; }
  .verdict-inline i{ width:3px; height:12px; flex:none; display:block; }
  .verdict-independent{ color:var(--color-accent-300); } .verdict-independent i{ background:var(--color-accent); }
  .verdict-operator{ color:var(--color-neutral-400); } .verdict-operator i{ background:var(--color-neutral-600); }
  .verdict-unsourced{ color:var(--color-neutral-500); } .verdict-unsourced i{ background:repeating-linear-gradient(to bottom, var(--color-neutral-700) 0 2px, transparent 2px 4px); }

  @media (max-width:1100px){
    :root{ --panel-w:340px; --inspector-w:340px; }
  }
  @media (max-width:760px){
    /* Phone: the panel becomes a bottom sheet under the map, and the
       inspector takes the whole width beside the rail. */
    #panel{ top:50%; bottom:0; left:var(--rail-w); right:0; width:auto; border-right:0; border-top:1px solid var(--color-divider-strong); }
    #mapwrap{ left:var(--rail-w); bottom:50%; }
    #detail{ left:var(--rail-w); right:0; width:auto; }
    .legend{ display:none; }
    .statusbar{ padding-left:110px; padding-right:16px; }
    .maplibregl-ctrl-bottom-right{ display:none; }
    .ov{ padding:32px 16px 96px; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>

<div id="shell">

      <button id="zoomOut" aria-label="Zoom out" title="Zoom out"><svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-minus"/></svg></button>
