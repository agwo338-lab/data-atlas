      <div><span class="lg s-operational"></span>Operational</div>
      <div><span class="lg s-under-construction"></span>Under construction</div>
      <div><span class="lg s-planned"></span>Planned</div>
      <hr>
      <div class="dim"><span class="lg-sizes"><i style="width:4px;height:4px"></i><i style="width:7px;height:7px"></i><i style="width:10px;height:10px"></i></span>Dot size ∝ disclosed MW</div>
    </div>
    <div class="statusbar" aria-live="polite"><span id="statusMeta"></span></div>
  </div>

  <nav id="rail" aria-label="Views">
    <div class="rail-mark" aria-hidden="true"><svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-pin"/></svg></div>
    <button data-view="atlas" aria-current="true" aria-label="Atlas" title="Atlas"><svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-globe"/></svg></button>
    <button data-view="sources" aria-current="false" aria-label="Sources &amp; method" title="Sources &amp; method"><svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-shield"/></svg></button>
    <span class="rail-gap"></span>
    <button data-fit aria-label="Reset view" title="Reset view"><svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-crosshair"/></svg></button>
  </nav>

  <section id="panel" aria-label="Operators and sites">
    <header class="panel-head">
      <div class="brand-row"><span class="brand">Site Atlas</span><span class="eyebrow">data center buildout</span></div>
      <div class="seg wide" id="panelSeg" role="tablist">
        <button role="tab" data-panel="operators" aria-pressed="true">Operators</button>
        <button role="tab" data-panel="sites" aria-pressed="false">Sites</button>
      </div>
    </header>

    <div class="panel-view" id="panelOperators">
      <div class="list-head"><span class="eyebrow" id="opsMeta"></span><span class="eyebrow racks-key"><svg class="rack" viewBox="0 0 9 13" aria-hidden="true"><rect x="0.5" y="0.5" width="8" height="12" rx="1.5"/><path d="M2.5 3.5h4M2.5 6.5h4M2.5 9.5h4"/></svg>= 100 MW</span></div>
      <div id="provList" class="scroll"></div>
    </div>

    <div class="panel-view" id="panelOperator" hidden>
      <div class="scroll" id="providerPanelBody"></div>
    </div>

    <div class="panel-view" id="panelSites" hidden>
      <div class="sites-head">
        <label class="field"><svg fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-search"/></svg><input id="q" placeholder="Filter sites, cities, operators" aria-label="Filter sites"></label>
        <div class="sites-filters">
          <div class="seg" id="statusSeg">
            <button data-f="operational" aria-pressed="false">Operational</button>
            <button data-f="all" aria-pressed="true">All</button>
          </div>
          <span class="eyebrow" id="sitesMeta"></span>
        </div>
      </div>
      <div class="rows scroll" id="rows"></div>
    </div>

    <footer class="panel-foot"><span class="mono" id="footMW"></span><span id="footCount"></span></footer>
  </section>

  <aside id="detail" aria-label="Site inspector"></aside>

  <section class="ov" id="viewSourcesMethod"></section>
  <section class="ov" id="viewSite"></section>
</div>

<script>
(function(){

  // SITES comes from data/sites.js, PROVIDERS from data/providers.js, NEWS
  // from data/news.js, and the confidence engine (SOURCE_CLASSES,
  // classifySource, scoreSite, scoreSiteField, VERDICTS, verdictFor,
  // liftAdvice, derivativeHint, BASIS_LABELS, CONFIDENCE_LEVELS,
  // PROVENANCE_FIELDS, hostOf, siteFieldBasis, siteFieldHasProvenance,
  // siteEvidenceFor, FIELD_LABELS) from data/sources.js — all loaded
  // before this script.
  //
  // ── Map of this script ─────────────────────────────────────────────────
  // Each section below opens with a ═══ banner; search for the banner text
  // to jump there. The DOM ids each one owns are listed so a change to the
  // markup can be traced without reading the whole file.
  //
  //   Helpers            esc, ICON (sprite icons), fmtDate, statusSlug
  //   Provider colors    colorFor, providerOrder, tableSortCompare
  //   Confidence         confBadge, classChip, verdictInline, siteVerdict
  //   Sky                #sky #starfield · the seeded star canvas
  //   Map                #map #mapLoading · globe + atmosphere, pins
  //                      (pinEls), fitTo/fitSites,
  //                      zoomToSite (offsets for the inspector), #zoomIn
  //                      #zoomOut [data-fit]
  //   Operators list     #provList #opsMeta · capacitySplit, racksHtml
  //                      (the rack pictogram), renderRail
  //   Sites tab          #rows #q #statusSeg #sitesMeta · visibleSites,
  //                      siteRowHtml (shared with the operator page)
  //   Site inspector     #detail · selectSite, closeDetail
  //   Sources & method   #viewSourcesMethod · renderSourcesMethodView
  //   Operator page      #providerPanelBody · renderProviderView, and the
  //                      panel views #panelOperators #panelOperator
  //                      #panelSites #panelSeg · setPanelView,
  //                      openProviderView, closeProviderPanel
  //   Site page          #viewSite · renderSiteView, openSiteView
  //   View switching     #rail [data-view] · switchMainView (atlas /
  //                      sources / site)
  //   Pipeline diagram   PIPELINE_SVG (hand-written; keep in step with the
  //                      auto-apply policy in CLAUDE.md)
  //   Boot               #statusMeta #footMW #footCount
  //
  // tools/check.js verifies every id above exists before a push.

  var TODAY = new Date().toISOString().slice(0, 10);

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }
  // Inline icon from the sprite in <body>; `extra` lands on the <svg> tag.
  function ICON(id, extra){
    return '<svg' + (extra || "") + ' fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><use href="#i-' + id + '"/></svg>';
  }
  function hexToRgba(hex, a){
    var h = hex.replace("#", "");
    var n = parseInt(h, 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }
  function statusSlug(status){ return (status||"").toLowerCase().replace(/[^a-z]+/g,"-").replace(/(^-|-$)/g,""); }
  function fmtDate(iso){
    if (!iso) return "—";
    var d = new Date(iso + "T00:00:00Z");
    if (isNaN(d.getTime())) return iso;
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric", timeZone: "UTC" });
  }

  // ---- Provider colors ---------------------------------------------------
  var PALETTE = ["#E39149", "#5B9BE0", "#9A85E0", "#E0708A", "#D9C24E", "#4FC2C9", "#C97AD1"];
  var providerLookup = {};
  (typeof PROVIDERS !== "undefined" ? PROVIDERS : []).forEach(function(p){ providerLookup[p.name] = p; });
  var providerColor = {};
  (function assignColors(){
    var seen = [];
    SITES.forEach(function(s){ if (seen.indexOf(s.provider) === -1) seen.push(s.provider); });
    var next = 0;
    seen.forEach(function(p){
      var pinned = providerLookup[p] && providerLookup[p].color;
      providerColor[p] = pinned || PALETTE[next++ % PALETTE.length];
    });
  })();
  function colorFor(provider){ return providerColor[provider] || "#b9b1a2"; }
  var providerOrder = Object.keys(providerColor);
  var STATUS_ORDER = { "Operational": 0, "Under construction": 1, "Planned": 2 };
  function tableSortCompare(a, b){
    var pd = providerOrder.indexOf(a.provider) - providerOrder.indexOf(b.provider);
    if (pd !== 0) return pd;
    var sa = STATUS_ORDER[a.status] != null ? STATUS_ORDER[a.status] : 99;
    var sb = STATUS_ORDER[b.status] != null ? STATUS_ORDER[b.status] : 99;
    return sa - sb;
  }

  // ---- Confidence / verdict rendering ------------------------------------
  function confBadge(score, opts){
    opts = opts || {};
    var lvl = CONFIDENCE_LEVELS[score.level] || CONFIDENCE_LEVELS.unverified;
    var title = opts.title || score.reason || "";
    return '<span class="conf-badge" tabindex="0" role="img" aria-label="' + lvl.label + ' confidence' + (title ? '. ' + esc(title) : '') + '"' +
      ' style="--conf-fg:' + lvl.color + ';--conf-bg:' + hexToRgba(lvl.color, 0.12) + ';--conf-bd:' + hexToRgba(lvl.color, 0.3) + '"' +
      (title ? ' title="' + esc(title) + '"' : '') +
      '><span class="conf-label">' + lvl.label + '</span></span>';
  }
  function classChip(code){
    var c = SOURCE_CLASSES[code];
    if (!c) return "";
    return '<span class="cls' + (c.independent ? ' ind' : '') + '" title="' + esc(c.label + " — " + c.blurb) + '">' + c.code + '</span>';
  }
  function verdictInline(v, extra){
    return '<span class="vd ' + v.key + '"><i></i>' + v.label + (extra || '') + '</span>';
  }
  function scoredFields(site){
    return PROVENANCE_FIELDS.filter(function(f){ return !(f === "capacityMW" && site.capacityMW == null); });
  }
  // The site's single headline verdict: has anything other than the operator
  // confirmed any of this. Weakest-link, same logic as the confidence level.
  function siteVerdict(site){
    var fields = scoredFields(site);
    if (!fields.length) return VERDICTS.unsourced;
    var anyOperator = false, anyUnsourced = false;
    fields.forEach(function(f){
      var v = verdictFor(scoreSiteField(site, f, TODAY));
      if (v.key === "operator") anyOperator = true;
      if (v.key === "unsourced") anyUnsourced = true;
    });
    if (anyUnsourced) return VERDICTS.unsourced;
    return anyOperator ? VERDICTS.operator : VERDICTS.independent;
  }
  function basisHtml(site, field){
    var basis = siteFieldBasis(site, field);
    return (basis && basis !== "disclosed")
      ? '<span class="basis-tag basis-' + basis + '" title="Not disclosed by the operator — ' + basis + ' from the sources listed.">' + (BASIS_LABELS[basis] || basis) + '</span>'
      : '';
  }

  // ════════════════════════════════════════════════════════════════════
  // Sky — a still starfield behind the globe
  // ════════════════════════════════════════════════════════════════════
  // Drawn to a canvas rather than assembled from CSS gradients or a pile of
  // box-shadows: a few hundred dots with varying size, brightness and colour
  // cost one paint and stay crisp on a HiDPI screen, where a tiled gradient
  // would visibly repeat.
  //
  // Deliberately NOT animated. A twinkle would mean a permanent rAF loop
  // running alongside a WebGL globe for decoration, and the globe is what the
  // frame budget is for.
  (function sky(){
    var cv = document.getElementById("starfield");
    if (!cv || !cv.getContext) return;
    var ctx = cv.getContext("2d");

    // Seeded, so the same sky comes back after a resize instead of the stars
    // reshuffling themselves every time the window moves.
    function rng(seed){
      return function(){
        seed |= 0; seed = seed + 0x6D2B79F5 | 0;
        var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }

    // Starlight isn't white — most stars read faintly blue, a few warm.
    var TINTS = ["255,255,255", "214,226,255", "186,205,255", "255,236,214"];

    function draw(){
      var w = cv.clientWidth, h = cv.clientHeight;
      if (!w || !h) return;
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);

      var rand = rng(20260915);
      var count = Math.round(w * h / 5200); // density, not a fixed count
      for (var i = 0; i < count; i++) {
        var x = rand() * w, y = rand() * h;
        // Cube the roll so the big bright stars stay rare.
        var t = Math.pow(rand(), 3);
        var r = 0.35 + t * 1.25;
        var a = 0.22 + Math.pow(rand(), 1.6) * 0.62;
        var tint = TINTS[Math.floor(rand() * TINTS.length)];

        // The handful of largest stars get a soft bloom, which is most of what
        // sells this as a sky rather than as noise.
        if (t > 0.55) {
          var g = ctx.createRadialGradient(x, y, 0, x, y, r * 5.5);
          g.addColorStop(0, "rgba(" + tint + "," + (a * 0.5) + ")");
          g.addColorStop(1, "rgba(" + tint + ",0)");
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(x, y, r * 5.5, 0, 6.2832); ctx.fill();
        }
        ctx.fillStyle = "rgba(" + tint + "," + a + ")";
        ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
      }
    }

    draw();
    var pending;
    window.addEventListener("resize", function(){
      clearTimeout(pending);
      pending = setTimeout(draw, 150);
    });
  })();


  // ════════════════════════════════════════════════════════════════════
  // Map — MapLibre GL, CARTO Dark Matter vector basemap, globe projection
  // ════════════════════════════════════════════════════════════════════
  var pinEls = {};
  var DEFAULT_SITE_ZOOM = 9;
  var lons = SITES.map(function(s){ return s.lon; });
  var lats = SITES.map(function(s){ return s.lat; });
  var fitBoundsArg = [
    [Math.min.apply(null, lons), Math.min.apply(null, lats)],
    [Math.max.apply(null, lons), Math.max.apply(null, lats)]
  ];
  var DEFAULT_CENTER = [-98, 39];
  var DEFAULT_ZOOM = 3;

  var map = new maplibregl.Map({
    container: "map",
    style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
    center: DEFAULT_CENTER,
    zoom: DEFAULT_ZOOM,
    minZoom: 0.8,
    maxZoom: 14,
    dragRotate: false,
    pitchWithRotate: false,
    touchPitch: false
  });
  map.touchZoomRotate.disableRotation();
  map.addControl(new maplibregl.ScaleControl({ maxWidth: 90, unit: "metric" }), "bottom-left");
  // Globe instead of flat Mercator: vector tiles are Mercator-projected at
  // the data level regardless, but rendering them onto a sphere removes the
  // flat projection's area/distance distortion since a globe has no
  // projection to distort in the first place.
  map.on("style.load", function(){
    map.setProjection({ type: "globe" });
    // The default atmosphere is tuned for a bright sky and hazes the whole
    // sphere to a pale grey disc — which, over a starfield, reads as fog
    // rather than as a planet. Darkened to the graphite palette (no blue
    // horizon any more), and faded out entirely by the zoom at which the
    // projection stops being a globe anyway.
    try {
      map.setSky({
        "sky-color": "#08080a",
        "horizon-color": "#1e1e22",
        "fog-color": "#0d0d10",
        "sky-horizon-blend": 0.5,
        "horizon-fog-blend": 0.6,
        "fog-ground-blend": 0.2,
        "atmosphere-blend": ["interpolate", ["linear"], ["zoom"], 0, 0.6, 5, 0.25, 7, 0]
      });
    } catch (e) { console.warn("Site Atlas: sky styling unavailable", e); }
  });

  var CAP_MAX = Math.max.apply(null, SITES.map(function(s){ return s.capacityMW || 0; })) || 1;
  function pinDiameter(mw){
    var v = mw == null ? 0 : Math.max(0, mw);
    var t = Math.sqrt(v / CAP_MAX);
    return Math.round(10 + 24 * t); // 10..34px
  }

  function buildPins(){
    SITES.forEach(function(site){
      var slug = statusSlug(site.status);
      var d = pinDiameter(site.capacityMW);
      var el = document.createElement("div");
      el.className = "pin-marker pin-status-" + slug;
      el.style.setProperty("--dot", colorFor(site.provider));
      el.title = site.provider + (site.site ? " · " + site.site : "") + " (" + site.city + ") — " + site.status;
      el.tabIndex = 0;

      if (slug === "operational") {
        var pulse = document.createElement("span");
        pulse.className = "pin-pulse";
        pulse.style.width = d + "px"; pulse.style.height = d + "px";
        el.appendChild(pulse);
      }
      var halo = document.createElement("span");
      halo.className = "pin-halo";
      halo.style.width = (d + 10) + "px"; halo.style.height = (d + 10) + "px";
      var core = document.createElement("span");
      core.className = "pin-core";
      core.style.width = d + "px"; core.style.height = d + "px";
      var ring = document.createElement("span");
      ring.className = "pin-ring";
      ring.style.width = (d + 12) + "px"; ring.style.height = (d + 12) + "px";
      el.appendChild(halo);
      el.appendChild(ring);
      el.appendChild(core);

      var label = document.createElement("span");
      label.className = "pin-label";
      label.innerHTML =
        '<span class="pin-label-name">' + esc(site.provider) + ' · ' + esc(site.city) + '</span>' +
        '<span class="pin-label-cap">' + (site.capacityMW != null ? site.capacityMW + ' MW' : 'Capacity not disclosed') + '</span>';
      el.appendChild(label);

      el.addEventListener("click", function(e){ e.stopPropagation(); selectSite(site.id); });
      el.addEventListener("keydown", function(e){ if (e.key === "Enter" || e.key === " ") { e.preventDefault(); selectSite(site.id); } });

      new maplibregl.Marker({ element: el, anchor: "center" }).setLngLat([site.lon, site.lat]).addTo(map);
      pinEls[site.id] = el;
    });
    document.getElementById("mapLoading").style.display = "none";
  }

  map.on("load", function(){ buildPins(); fitTo(fitBoundsArg, { duration: 0 }); });
  map.on("error", function(){
    document.getElementById("mapLoading").textContent = "Couldn't load the map — check your connection and reload.";
  });

  // Scrolling/pinching out closes the detail card, treating it as the user
  // backing out to look at the wider map again. Only reacts to genuine user
  // gestures (flyTo/fitBounds calls leave originalEvent unset).
  //
  // But it needs slack: a single wheel notch is a fraction of a zoom level, so
  // reacting to the first backwards tick meant the card vanished while the user
  // was still looking at the same site — nudging the view out to see what is
  // next door read as "done with this". The card now holds until the user has
  // pulled back a real distance from the furthest in they got.
  var DETAIL_ZOOM_LEEWAY = 2.2;
  var detailZoomAnchor = null;
  map.on("zoom", function(e){
    if (!e.originalEvent) return;               // camera commands are not gestures
    if (!detailEl.classList.contains("on")) return;
    var z = map.getZoom();
    if (detailZoomAnchor == null || z > detailZoomAnchor) detailZoomAnchor = z;
    else if (z < detailZoomAnchor - DETAIL_ZOOM_LEEWAY) closeDetail();
  });

  // The inspector overlays the map's right edge, so a selected site is flown
  // to the centre of what is still visible rather than the centre of the canvas.
  function inspectorWidth(){
    if (window.innerWidth <= 760) return 0;
    return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--inspector-w")) || 0;
  }
  function inspectorOpen(){ return detailEl.classList.contains("on"); }
  function zoomToSite(site, targetZoom){
    map.flyTo({ center: [site.lon, site.lat], zoom: targetZoom || DEFAULT_SITE_ZOOM, duration: 650, offset: [-Math.round(inspectorWidth() / 2), 0] });
  }
  function fitTo(bounds, opts){
    var right = inspectorOpen() ? inspectorWidth() : 0;
    map.fitBounds(bounds, Object.assign({ padding: { top: 70, right: 70 + right, bottom: 60, left: 60 }, duration: 550, maxZoom: 7 }, opts || {}));
  }
  function fitSites(list){
    if (!list.length) return fitTo(fitBoundsArg);
    var lo = list.map(function(x){ return x.lon; }), la = list.map(function(x){ return x.lat; });
    fitTo([[Math.min.apply(null, lo), Math.min.apply(null, la)], [Math.max.apply(null, lo), Math.max.apply(null, la)]]);
  }
  document.querySelectorAll("[data-fit]").forEach(function(b){ b.addEventListener("click", function(){ fitTo(fitBoundsArg); }); });
  document.getElementById("zoomIn").addEventListener("click", function(){ map.zoomIn(); });
  document.getElementById("zoomOut").addEventListener("click", function(){ map.zoomOut(); });

  // ════════════════════════════════════════════════════════════════════
  // Operators list — disclosed capacity as racks, one row per operator
  // ════════════════════════════════════════════════════════════════════
  var activeProviders = {};
  providerOrder.forEach(function(p){ activeProviders[p] = true; });

  // Which operator's panel is open, if any. Held here rather than read back
  // off the DOM because renderRail() rebuilds the list wholesale whenever a
  // filter toggles, which would otherwise drop the tab marker.
  var openProvider = null;

  // Opening an operator's tab solos it on the map: its dashboard is on screen,
  // so the map should be showing the thing the dashboard is about. The filter
  // state from before the tab was opened is stashed here and put back when it
  // closes, so soloing is a temporary lens rather than something that quietly
  // rewrites the user's filters.
  //
  // Null means "nothing to restore" — either no tab is open, or the user has
  // since toggled a provider by hand, which is taken as them wanting control of
  // the filter back. Their choice then survives the panel closing.
  var providerFilterSnapshot = null;

  function soloProvider(name){
    providerOrder.forEach(function(p){ activeProviders[p] = (p === name); });
  }

  var RACK_SVG = '<svg class="rack" viewBox="0 0 9 13" aria-hidden="true"><rect x="0.5" y="0.5" width="8" height="12" rx="1.5"/><path d="M2.5 3.5h4M2.5 6.5h4M2.5 9.5h4"/></svg>';
  var STATUSES = ["Operational", "Under construction", "Planned"];
  function mwFmt(v){ return v.toLocaleString("en-US", { maximumFractionDigits: 1 }); }
  function plural(n, word){ return n + " " + word + (n === 1 ? "" : "s"); }
  function providerSites(p){ return SITES.filter(function(x){ return x.provider === p; }); }

  // Disclosed MW per status for a list of sites. Statuses with no site are
  // left out, so a tile never renders for a status the operator has nothing in.
  function capacitySplit(sites){
    return STATUSES.map(function(st){
      var list = sites.filter(function(x){ return x.status === st; });
      var disc = list.filter(function(x){ return x.capacityMW != null; });
      return { status: st, slug: statusSlug(st), n: list.length, mw: disc.reduce(function(t, x){ return t + x.capacityMW; }, 0), undis: list.length - disc.length };
    }).filter(function(g){ return g.n; });
  }

  // The capacity pictogram: one rack per `unit` MW, grouped into one segment
  // per status so hovering a segment lights it and names it. Tinted like the
  // pins — solid operational, half for under construction, faint for planned —
  // so the card reads as a close-up of the map rather than a second chart.
  function racksHtml(split, unit, color){
    var segs = split.filter(function(g){ return g.mw > 0; });
    if (!segs.length) return "";
    return '<div class="racks" style="--pc:' + color + '">' + segs.map(function(g){
      var n = Math.max(1, Math.round(g.mw / unit));
      var detail = mwFmt(g.mw) + ' MW' + (g.n != null ? ' · ' + plural(g.n, 'site') : '');
      return '<span class="capseg s-' + g.slug + '" title="' + esc(g.status + ' · ' + detail) + '">' +
        new Array(n + 1).join(RACK_SVG) +
        '<span class="tip"><b>' + esc(g.status) + '</b><span>' + esc(detail) + '</span></span></span>';
    }).join('') + '</div>';
  }
  function racksLegend(color, unit){
    return '<div class="racks-legend" style="--pc:' + color + '">' +
      '<span class="capseg s-operational">' + RACK_SVG + ' operational</span>' +
      '<span class="capseg s-under-construction">' + RACK_SVG + ' under construction</span>' +
      '<span class="capseg s-planned">' + RACK_SVG + ' planned</span>' +
      '<span>· one rack = ' + unit + ' MW</span></div>';
  }

  function renderRail(){
    var byProv = providerOrder.map(function(p){
      var sites = providerSites(p);
      var split = capacitySplit(sites);
      return {
        name: p, n: sites.length, split: split,
        mw: split.reduce(function(t, g){ return t + g.mw; }, 0),
        undis: sites.filter(function(x){ return x.capacityMW == null; }).length
      };
    }).sort(function(a, b){ return b.mw - a.mw; });

    document.getElementById("opsMeta").textContent = plural(byProv.length, "operator") + " · by disclosed MW";
    document.getElementById("provList").innerHTML = byProv.map(function(p){
      var racks = racksHtml(p.split, 100, colorFor(p.name));
      return '<button class="prov" data-prov="' + esc(p.name) + '"' + (openProvider === p.name ? ' aria-expanded="true"' : '') + '>' +
        '<span class="dot" style="background:' + colorFor(p.name) + '"></span>' +
        '<span class="pname">' + esc(p.name) + '</span>' +
        '<span class="pmw">' + mwFmt(p.mw) + ' MW</span>' +
        (racks || '<span class="pnone">no disclosed capacity yet</span>') +
        '<span class="pcount">' + plural(p.n, "site") + ' · ' + p.undis + ' undisclosed</span>' +
      '</button>';
    }).join("");

    document.querySelectorAll("#provList .prov").forEach(function(btn){
      btn.addEventListener("click", function(){ openProviderView(btn.getAttribute("data-prov")); });
    });
  }

  function applyPinFilter(){
    SITES.forEach(function(s){
      if (pinEls[s.id]) pinEls[s.id].classList.toggle("dim", !activeProviders[s.provider]);
    });
  }

  // ════════════════════════════════════════════════════════════════════
  // Sites tab — searchable, filterable site list, shared row markup
  // ════════════════════════════════════════════════════════════════════
  var query = "";
  var statusFilter = "all";
  var selectedId = null;

  function visibleSites(){
    var q = query.trim().toLowerCase();
    return SITES.filter(function(x){
      if (!activeProviders[x.provider]) return false;
      if (statusFilter === "operational" && x.status !== "Operational") return false;
      if (!q) return true;
      var hay = (x.site || "") + " " + x.city + " " + x.country + " " + x.provider + " " + x.status;
      return hay.toLowerCase().indexOf(q) !== -1;
    }).sort(function(a, b){ return (b.capacityMW || 0) - (a.capacityMW || 0); });
  }

  // One site row, shared by the Sites tab and the operator page. The tick on
  // the right is the only trace of the confidence engine left on the atlas
  // view: bright when something other than the operator backs the entry.
  function siteRowHtml(x, opts){
    opts = opts || {};
    var vd = siteVerdict(x);
    var sub = esc(x.city) + ', ' + esc(x.country) + (opts.provider === false ? '' : ' · ' + esc(x.provider));
    return '<button class="site-row" data-id="' + x.id + '"' + (selectedId === x.id ? ' aria-selected="true"' : '') + '>' +
      '<span class="sg s-' + statusSlug(x.status) + '" style="--c:' + colorFor(x.provider) + '" title="' + esc(x.status) + '"></span>' +
      '<span class="sr-main"><span class="sr-name">' + esc(x.site || x.city) + '</span><span class="sr-sub">' + sub + '</span></span>' +
      (x.capacityMW == null ? '<span class="sr-mw none">—</span>' : '<span class="sr-mw">' + mwFmt(x.capacityMW) + ' MW</span>') +
      '<span class="sr-tick ' + vd.key + '" title="' + esc(vd.label) + '"></span>' +
    '</button>';
  }
  function wireSiteRows(root){
    root.querySelectorAll(".site-row[data-id]").forEach(function(r){
      r.addEventListener("click", function(){ selectSite(r.getAttribute("data-id")); });
    });
  }
  function markSelectedRows(){
    document.querySelectorAll(".site-row[data-id]").forEach(function(r){
      if (r.getAttribute("data-id") === selectedId) r.setAttribute("aria-selected", "true"); else r.removeAttribute("aria-selected");
    });
  }

  function renderRows(){
    var v = visibleSites();
    document.getElementById("sitesMeta").textContent = plural(v.length, "site") + " · by MW";
    var rowsEl = document.getElementById("rows");
    rowsEl.innerHTML = v.length ? v.map(function(x){ return siteRowHtml(x); }).join("") : '<div class="rows-empty">No sites match.</div>';
    wireSiteRows(rowsEl);
  }

  document.getElementById("q").addEventListener("input", function(e){ query = e.target.value; renderRows(); });
  document.querySelectorAll("#statusSeg button").forEach(function(btn){
    btn.addEventListener("click", function(){
      statusFilter = btn.getAttribute("data-f");
      document.querySelectorAll("#statusSeg button").forEach(function(b){ b.setAttribute("aria-pressed", String(b === btn)); });
      renderRows();
    });
  });

  // ════════════════════════════════════════════════════════════════════
  // Site inspector — one site, its figure as racks, notes and sources
  // ════════════════════════════════════════════════════════════════════
  var detailEl = document.getElementById("detail");

  function closeDetail(){
    selectedId = null;
    detailEl.classList.remove("on");
    Object.keys(pinEls).forEach(function(k){ pinEls[k].classList.remove("active"); });
    markSelectedRows();
  }

  function selectSite(id){
    var site = SITES.filter(function(x){ return x.id === id; })[0];
    if (!site) return;
    selectedId = id;
    if (currentView !== "atlas") switchMainView("atlas");
    Object.keys(pinEls).forEach(function(k){ pinEls[k].classList.toggle("active", k === id); });
    markSelectedRows();
    detailEl.classList.add("on");
    zoomToSite(site);
    // Measure the leeway from where the card is about to land, not from
    // wherever the map happened to be sitting when the site was picked.
    detailZoomAnchor = DEFAULT_SITE_ZOOM;

    var color = colorFor(site.provider);
    var capNote = "";
    if (site.capacityMW != null) {
      var cv = verdictFor(scoreSiteField(site, "capacityMW", TODAY));
      var basis = siteFieldBasis(site, "capacityMW");
      capNote = 'one rack = 10 MW · ' +
        (cv.key === "independent" ? 'independently verified figure' : cv.key === "operator" ? 'operator-disclosed figure' : 'unsourced figure') +
        (basis && basis !== "disclosed" ? ' · ' + String(BASIS_LABELS[basis] || basis).toLowerCase() : '');
    }
    var sources = site.sources || [];
    var sourcesHtml = sources.map(function(x){
      return '<div class="src">' + classChip(classifySource(x, site.provider)) +
        '<span><a href="' + x.url + '" target="_blank" rel="noopener">' + esc(x.label) + '</a>' +
        '<span class="sm">' + esc(hostOf(x.url) || '') + '</span></span></div>';
    }).join("");

    detailEl.innerHTML =
      '<div class="d-top">' +
        '<button class="d-op" id="detailProv" title="Open the operator page"><span class="dot" style="background:' + color + '"></span>' + esc(site.provider) + ' ' + ICON("chev", ' style="width:12px;height:12px"') + '</button>' +
        '<button class="iconbtn dclose" aria-label="Close">' + ICON("x") + '</button>' +
      '</div>' +
      '<div class="d-body">' +
        '<div class="d-head">' +
          '<h1 class="d-title">' + esc(site.site || site.city) + '</h1>' +
          '<div class="d-place">' + esc(site.city) + ', ' + esc(site.country) + '</div>' +
          '<div class="d-coords">' + site.lat.toFixed(4) + ', ' + site.lon.toFixed(4) + (siteFieldBasis(site, "location") === "estimated" ? ' · pin is an estimate' : '') + '</div>' +
          '<div class="d-chips"><span class="chip"><span class="sg s-' + statusSlug(site.status) + '"></span>' + esc(site.status) + '</span>' +
            '<span class="chip">Updated ' + esc(fmtDate(site.lastUpdated)) + '</span></div>' +
        '</div>' +
        '<div class="d-figure">' +
          (site.capacityMW != null
            ? '<div class="p-cap"><b>' + mwFmt(site.capacityMW) + '</b><span class="eyebrow">MW disclosed</span></div>' +
              racksHtml([{ status: site.status, slug: statusSlug(site.status), mw: site.capacityMW, n: null }], 10, color) +
              '<span class="cap-note">' + esc(capNote) + '</span>'
            : '<span class="cap-none">Capacity not disclosed.</span>') +
        '</div>' +
        (site.notes && site.notes.length
          ? '<div class="d-section"><span class="eyebrow">What we know</span><p class="d-notes" id="detailNotes">' + esc(site.notes) + '</p><button class="d-more" id="detailMore">Read more</button></div>'
          : '') +
        (sourcesHtml ? '<div class="d-section"><span class="eyebrow">Sources · ' + sources.length + '</span><div>' + sourcesHtml + '</div></div>' : '') +
      '</div>' +
      '<div class="d-foot">' +
        '<button class="primary" id="detailOpen">Open site page ' + ICON("out") + '</button>' +
        '<button class="ghost" id="detailZoom">' + ICON("crosshair") + 'Zoom to site</button>' +
      '</div>';

    detailEl.querySelector(".dclose").addEventListener("click", closeDetail);
    document.getElementById("detailProv").addEventListener("click", function(){ openProviderView(site.provider); });
    document.getElementById("detailOpen").addEventListener("click", function(){ openSiteView(site.id); });
    document.getElementById("detailZoom").addEventListener("click", function(){ zoomToSite(site, 12); detailZoomAnchor = 12; });
    var more = document.getElementById("detailMore"), notes = document.getElementById("detailNotes");
    if (more && notes) {
      if (notes.scrollHeight <= notes.clientHeight + 2) more.hidden = true;
      more.addEventListener("click", function(){
        notes.classList.toggle("open");
        more.textContent = notes.classList.contains("open") ? "Show less" : "Read more";
      });
    }
    detailEl.querySelector(".d-body").scrollTop = 0;
  }

  // ════════════════════════════════════════════════════════════════════
  // Sources & method — one continuous page (merges the old Sources and
  // Method tabs, per the redesign brief). Rendered from data/sources.js so
  // it can't drift from the rules it describes.
  // ════════════════════════════════════════════════════════════════════
  function computeFieldVerdictTally(){
    var counts = { independent: 0, operator: 0, unsourced: 0 };
    var total = 0;
    SITES.forEach(function(s){
      scoredFields(s).forEach(function(f){
        var v = verdictFor(scoreSiteField(s, f, TODAY));
        counts[v.key] = (counts[v.key] || 0) + 1;
        total++;
      });
    });
    return { counts: counts, total: total };
  }

  function renderSourcesMethodView(){
    var tally = computeFieldVerdictTally();
    var indepPct = tally.total ? Math.round(tally.counts.independent / tally.total * 100) : 0;
    var opPct = tally.total ? Math.round(tally.counts.operator / tally.total * 100) : 0;
    var unsPct = Math.max(0, 100 - indepPct - opPct);

    var classesHtml = SOURCE_CLASS_ORDER.map(function(code){
      var c = SOURCE_CLASSES[code];
      return '<div class="cl' + (c.independent ? ' ind' : '') + '"><span class="code">' + c.code + '</span>' +
        '<span class="lab">' + esc(c.label) + (c.independent ? ' <span style="color:var(--color-neutral-500);font-weight:400;font-size:11.5px">independent</span>' : '') + '</span>' +
        '<span class="bl">' + esc(c.blurb) + '</span></div>';
    }).join("");

    var channelsHtml = SOURCE_CHANNELS.map(function(ch){
      var name = ch.url ? '<a href="' + ch.url + '" target="_blank" rel="noopener">' + esc(ch.name) + '</a>' : esc(ch.name);
      return '<tr><td class="cls-cell">' + classChip(ch.cls) + '</td><td class="ch-name">' + name + '</td>' +
        '<td class="ch-gives">' + esc(ch.gives) + '</td><td class="ch-meta">' + esc(ch.scope) + '</td>' +
        '<td class="ch-meta">' + esc(ch.cadence) + '</td><td class="ch-meta">' + esc(ch.access) + '</td></tr>';
    }).join("");

    var siteTally = {};
    var ordered = SITES.slice().sort(function(a, b){
      var ra = CONFIDENCE_LEVELS[scoreSite(a, TODAY).level].rank;
      var rb = CONFIDENCE_LEVELS[scoreSite(b, TODAY).level].rank;
      return ra !== rb ? ra - rb : tableSortCompare(a, b);
    });
    var entriesHtml = ordered.map(function(site){
      siteTally[scoreSite(site, TODAY).level] = (siteTally[scoreSite(site, TODAY).level] || 0) + 1;
      var overall = scoreSite(site, TODAY);
      var links = (site.sources || []).map(function(s){
        return classChip(classifySource(s, site.provider)) + ' <a href="' + s.url + '" target="_blank" rel="noopener">' + esc(s.label) + '</a>';
      }).join('<br>');
      return '<tr>' +
        '<td><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:.5rem;vertical-align:middle;background:' + colorFor(site.provider) + '"></span>' +
          '<span class="plink" data-open-site="' + site.id + '">' + esc(site.provider) + ' — ' + esc(site.city) + (site.site ? ' <span style="color:var(--color-neutral-500)">(' + esc(site.site) + ')</span>' : '') + '</span></td>' +
        '<td>' + confBadge(overall, { title: "A site scores as its weakest field." }) + '</td>' +
        '<td class="ch-meta">' + fmtDate(site.lastUpdated) + '</td>' +
        '<td>' + (links || '<span class="empty-note">No sources logged</span>') + '</td>' +
      '</tr>';
    }).join("");

    var order = ["high", "medium", "low", "unverified"];
    var tallyRowHtml = order.map(function(k){
      var lvl = CONFIDENCE_LEVELS[k];
      return '<div class="tally-card" style="--tc:' + lvl.color + '"><div class="tally-value">' + (siteTally[k] || 0) + '</div><div class="tally-label">' + lvl.label + ' confidence</div></div>';
    }).join("") + '<div class="tally-card" style="--tc:var(--color-accent)"><div class="tally-value">' + SITES.length + '</div><div class="tally-label">sites tracked</div></div>';

    var el = document.getElementById("viewSourcesMethod");
    el.innerHTML = '<div class="wrap">' +
      '<button class="back-link">← Back to atlas</button>' +
      '<h2 style="font-size:30px;letter-spacing:-.025em">Where the numbers come from</h2>' +
      '<p class="lede">Corroboration is counted across source <em>classes</em>, not across articles. An operator\'s press release written up by two trade outlets is one claim republished twice — so a claim only reads as verified when a public record or an independent observation stands behind it.</p>' +

      '<div class="tally"><b>' + tally.counts.operator + '</b><span>of ' + tally.total + ' scored fields in this dataset are the operator\'s word, and nothing else.</span></div>' +
      '<div class="meter"><i style="flex:' + Math.max(indepPct,1) + '"></i><i style="flex:' + Math.max(opPct,1) + '"></i><i style="flex:' + Math.max(unsPct,1) + '"></i></div>' +
      '<div class="stat-sub">' + tally.counts.independent + ' independently verified · ' + tally.counts.operator + ' operator\'s word · ' + tally.counts.unsourced + ' unsourced — computed live from data/sites.js and data/sources.js.</div>' +

      '<div class="band"><h4>The eight classes</h4><p>Three of them are produced independently of any announcement. Only those can lift a claim past "the operator says so".</p></div>' +
      '<div class="classes">' + classesHtml + '</div>' +

      '<div class="band"><h4>Channels worth the effort</h4><p>The working catalogue. Regulatory and network channels are filed or observed independently, and most are diffable on a schedule rather than read once.</p></div>' +
      '<table class="table"><thead><tr><th>Class</th><th>Channel</th><th>What it gives you</th><th>Coverage</th><th>Cadence</th><th>Access</th></tr></thead><tbody>' + channelsHtml + '</tbody></table>' +

      '<div class="band"><h4>The confidence rules</h4></div>' +
      '<ul class="rule-list">' +
        '<li><strong>High</strong><span>Two or more distinct classes agree, at least one of them independent (regulatory, network, or observed), and the freshest evidence is inside this field\'s re-check window. Renders as <em>Independently verified</em>.</span></li>' +
        '<li><strong>Medium</strong><span>Two or more classes agree but all of them are the operator or outlets restating the operator — or a single regulatory record standing alone. Believable, uncorroborated — written and shown as <em>Operator\'s word</em>.</span></li>' +
        '<li><strong>Low</strong><span>One class only, or every source is past its window, or sources genuinely conflict. Conflicts are never silently resolved.</span></li>' +
        '<li><strong>Unverified</strong><span>Nothing usable. Directory and unattributed sources are still cited on the entry, but they cannot lift a claim above this.</span></li>' +
      '</ul>' +
      '<p class="lede" style="margin-top:var(--space-4)">Where the current dataset actually stands under these rules, computed live rather than written down:</p>' +
      '<div class="tally-row">' + tallyRowHtml + '</div>' +

      '<div class="band"><h4>How a fact becomes a pin</h4><p class="method-lede">Four layers, and the distinction between them matters more than the flow does. A <strong>trigger</strong> starts a run. A <strong>worker</strong> researches and reports — and cannot write a file, ever, because it holds no tool that could. The <strong>applier</strong> is the main session, the one thing here with write and git access, and it routes findings by confidence. The <strong>data files</strong> feed the page. <span style="font-weight:500">data/sources.js</span> is drawn apart on purpose: it is a ruleset that both the researcher and the page read, not a stage anything passes through.</p></div>' +
      '<div class="method-figure" id="pipelineFigure"></div>' +

      '<div class="band"><h4>Every entry, weakest first</h4><p>The worklist. Sorted by confidence so the entries most in need of a second, independent source class surface first.</p></div>' +
      '<table class="table"><thead><tr><th>Site</th><th>Confidence</th><th>Last updated</th><th>Sources</th></tr></thead><tbody>' + entriesHtml + '</tbody></table>' +

      '<div class="band"><h4>Why classes, not tiers</h4><p>The atlas used to call a claim confident when two reputable sources agreed. That test quietly failed on the most common case in this industry: an operator issues a press release, two trade outlets write it up, and the claim collects two ticks without anything ever having checked it. Both outlets are downstream of the same interested party. Independence has to be measured by who produced the evidence and why — which is what these classes encode.</p></div>' +
    '</div>';

    el.querySelector(".back-link").addEventListener("click", function(){ switchMainView("atlas"); });
    el.querySelectorAll("[data-open-site]").forEach(function(node){
      node.addEventListener("click", function(){ openSiteView(node.getAttribute("data-open-site")); });
    });
    document.getElementById("pipelineFigure").innerHTML = PIPELINE_SVG;
  }

  // ════════════════════════════════════════════════════════════════════
  // Provider page
  // ════════════════════════════════════════════════════════════════════
  // The operator's mark: its own site icon, fetched by domain, so no logo
  // files live in the repo. An explicit `logo` URL in data/providers.js wins;
  // an entry with neither gets a lettered tile.
  function providerLogoHtml(p){
    var entry = providerLookup[p] || {};
    if (entry.logo) return '<span class="op-logo"><img src="' + esc(entry.logo) + '" alt="" width="26" height="26"></span>';
    if (entry.domain) return '<span class="op-logo"><img src="https://www.google.com/s2/favicons?domain=' + encodeURIComponent(entry.domain) + '&amp;sz=64" alt="" width="26" height="26"></span>';
    return '<span class="op-logo fallback" aria-hidden="true">' + esc(p.charAt(0)) + '</span>';
  }

  function renderProviderView(p){
    var color = colorFor(p);
    var entry = providerLookup[p] || {};
    var sitesOf = providerSites(p).sort(function(a, b){ return (b.capacityMW || 0) - (a.capacityMW || 0); });
    var split = capacitySplit(sitesOf);
    var totalMW = split.reduce(function(t, g){ return t + g.mw; }, 0);
    var undisclosed = sitesOf.filter(function(x){ return x.capacityMW == null; }).length;
    var operational = sitesOf.filter(function(x){ return x.status === "Operational"; }).length;
    var countries = [];
    sitesOf.forEach(function(x){ if (x.country && countries.indexOf(x.country) === -1) countries.push(x.country); });

    var tiles = '<div class="tiles">' + split.map(function(g){
      return '<div class="tile"><span class="eyebrow"><span class="sg s-' + g.slug + '"></span>' + esc(g.status === "Under construction" ? "Building" : g.status) + '</span>' +
        '<b>' + (g.mw > 0 ? mwFmt(g.mw) + '<small> MW</small>' : '—') + '</b>' +
        '<span>' + plural(g.n, "site") + (g.undis ? ' · ' + g.undis + ' undisclosed' : '') + '</span></div>';
    }).join('') + '</div>';

    var partners = entry.partners || [];
    var partnersHtml = partners.length
      ? '<ul class="partner-list">' + partners.map(function(partner){
          var sourceLinks = (partner.sources || []).map(function(x){ return '<a href="' + x.url + '" target="_blank" rel="noopener">' + esc(x.label) + '</a>'; }).join(', ');
          return '<li class="partner-card">' +
            '<div class="partner-top"><span class="partner-name">' + esc(partner.name) + '</span>' +
              (partner.since ? '<span class="partner-since">' + esc(partner.since) + '</span>' : '') +
            '</div>' +
            '<span class="partner-relationship">' + esc(partner.relationship) + '</span>' +
            (partner.detail ? '<p class="partner-detail">' + esc(partner.detail) + '</p>' : '') +
            (sourceLinks ? '<span class="partner-meta">' + sourceLinks + '</span>' : '') +
          '</li>';
        }).join('') + '</ul>'
      : '<p class="empty-note">No disclosed partnerships logged yet.</p>';

    var curated = (typeof NEWS !== "undefined" && NEWS[p]) ? NEWS[p] : [];
    var headlinesHtml;
    if (curated.length) {
      headlinesHtml = '<ul class="headline-list">' + curated.slice().sort(function(a, b){ return (b.date || "").localeCompare(a.date || ""); }).map(function(h){
        var sourceLinks = (h.sources || []).map(function(x){ return '<a href="' + x.url + '" target="_blank" rel="noopener">' + esc(x.label) + '</a>'; }).join(', ');
        return '<li class="headline-item"><div class="headline-top"><span class="headline-date">' + esc(h.date || '') + '</span><span>·</span><span class="headline-category">' + esc(h.category || 'other') + '</span></div>' +
          '<span class="headline-title">' + esc(h.headline) + '</span>' +
          (h.why ? '<p class="headline-why">' + esc(h.why) + '</p>' : '') +
          (sourceLinks ? '<span class="headline-meta">Source: ' + sourceLinks + '</span>' : '') +
        '</li>';
      }).join('') + '</ul>';
    } else {
      var seenUrls = {}, fallback = [];
      sitesOf.slice().sort(function(a, b){ return (b.lastUpdated || "").localeCompare(a.lastUpdated || ""); }).forEach(function(x){
        (x.sources || []).forEach(function(src){
          if (seenUrls[src.url]) return;
          seenUrls[src.url] = true;
          fallback.push({ label: src.label, url: src.url, site: x.site || x.city, lastUpdated: x.lastUpdated });
        });
      });
      headlinesHtml = fallback.length
        ? '<ul class="headline-list"><li class="empty-note">No curated headlines yet — showing sourced citations from this operator\'s sites instead.</li>' +
          fallback.map(function(h){ return '<li class="headline-item"><a href="' + h.url + '" target="_blank" rel="noopener">' + esc(h.label) + '</a><span class="headline-meta">' + esc(h.site) + (h.lastUpdated ? ' · checked ' + fmtDate(h.lastUpdated) : '') + '</span></li>'; }).join('') + '</ul>'
        : '<p class="empty-note">No sourced coverage logged yet.</p>';
    }

    var summaryHtml = entry.summary ? '<p class="p-summary">' + esc(entry.summary) + '</p>' : '';

    var el = document.getElementById("providerPanelBody");
    el.innerHTML =
      '<div class="op-nav">' +
        '<button class="back-link" id="opBack">' + ICON("back") + 'Operators</button>' +
        '<button class="ghost sm" id="opFit" title="Fit the map to this operator\'s sites">' + ICON("crosshair") + 'Fit map</button>' +
      '</div>' +
      '<div class="op-head">' +
        '<div class="op-ident">' + providerLogoHtml(p) +
          '<div style="display:flex;flex-direction:column;gap:3px;min-width:0"><h1>' + esc(p) + '</h1>' +
          '<span class="op-meta"><span class="dot" style="background:' + color + '"></span>' + plural(sitesOf.length, "site") +
            ' · ' + countries.length + (countries.length === 1 ? ' country' : ' countries') +
            (entry.domain ? ' · ' + esc(entry.domain) : '') + '</span></div>' +
        '</div>' + summaryHtml +
      '</div>' +
      '<div class="p-figure">' +
        '<div class="p-cap"><b>' + (totalMW > 0 ? mwFmt(totalMW) : '—') + '</b><span class="eyebrow">MW disclosed</span>' +
          '<span class="p-cap-meta">' + operational + ' operational · ' + undisclosed + ' disclose no figure</span></div>' +
        (totalMW > 0 ? racksHtml(split, 100, color) + racksLegend(color, 100) : '<span class="empty-note">No site of this operator has a disclosed figure yet.</span>') +
        tiles +
      '</div>' +
      '<div class="p-section p-sites"><div class="list-head"><h2>Sites · ' + sitesOf.length + '</h2><span class="eyebrow">by disclosed MW</span></div>' +
        sitesOf.map(function(x){ return siteRowHtml(x, { provider: false }); }).join('') +
      '</div>' +
      '<div class="p-section"><h2>Partnerships</h2>' + partnersHtml + '</div>' +
      '<div class="p-section"><h2>Latest headlines</h2>' + headlinesHtml +
        '<a class="p-search-link" href="https://www.google.com/search?tbm=nws&q=' + encodeURIComponent(p + " data center") + '" target="_blank" rel="noopener">Search for more coverage of ' + esc(p) + ' →</a>' +
      '</div>';

    wireSiteRows(el);
    document.getElementById("opBack").addEventListener("click", function(){ closeProviderPanel(); });
    document.getElementById("opFit").addEventListener("click", function(){ fitSites(sitesOf); });
  }

  // ── The panel's three views: the operator list, one operator, the site list.
  // Opening an operator pushes into the same panel; back returns to the list.
  var panelView = "operators";
  function setPanelView(v){
    panelView = v;
    document.getElementById("panelOperators").hidden = v !== "operators";
    document.getElementById("panelOperator").hidden = v !== "operator";
    document.getElementById("panelSites").hidden = v !== "sites";
    document.querySelectorAll("#panelSeg button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.getAttribute("data-panel") === (v === "operator" ? "operators" : v)));
    });
  }
  document.querySelectorAll("#panelSeg button").forEach(function(b){
    b.addEventListener("click", function(){
      var target = b.getAttribute("data-panel");
      if (openProvider) closeProviderPanel(target); else setPanelView(target);
    });
  });

  // Opening an operator solos it on the map and fits the map to its sites.
  function openProviderView(p){
    if (currentView !== "atlas") switchMainView("atlas");
    if (!openProvider) providerFilterSnapshot = Object.assign({}, activeProviders);
    soloProvider(p);
    openProvider = p;
    renderProviderView(p);
    setPanelView("operator");
    document.getElementById("providerPanelBody").scrollTop = 0;
    renderRail(); renderRows(); applyPinFilter();
    fitSites(providerSites(p));
  }

  function closeProviderPanel(nextView){
    if (!openProvider) { setPanelView(nextView || "operators"); return; }
    openProvider = null;
    if (providerFilterSnapshot) {
      activeProviders = providerFilterSnapshot;
      providerFilterSnapshot = null;
    }
    setPanelView(nextView || "operators");
    renderRail(); renderRows(); applyPinFilter();
  }

  document.addEventListener("keydown", function(e){
    if (e.key !== "Escape") return;
    if (inspectorOpen()) closeDetail();
    else if (openProvider) closeProviderPanel();
  });

  // ════════════════════════════════════════════════════════════════════
  // Site page — one facility, all of its evidence
  // ════════════════════════════════════════════════════════════════════
  function fact(label, value){
    return '<div class="fact"><div class="fact-label">' + label + '</div><div class="fact-value">' + value + '</div></div>';
  }

  function discBlock(label, score, site, field){
    var v = verdictFor(score);
    var hint = derivativeHint(score);
    return '<div class="disc-block">' +
      '<div class="disc-head"><span class="disc-field">' + esc(label) + '</span>' + verdictInline(v) + confBadge(score, { title: score.reason }) + '</div>' +
      '<p class="disc-blurb">' + esc(v.blurb) + '</p>' +
      '<p class="disc-lift"><strong>What would confirm it:</strong> ' + esc(liftAdvice(score, field, site.status)) + '</p>' +
      (hint ? '<p class="disc-hint">' + esc(hint) + '</p>' : '') +
    '</div>';
  }

  function renderDisclosure(site){
    var fields = scoredFields(site);
    var hasProv = fields.some(function(f){ return siteFieldHasProvenance(site, f); });
    var out = "";
    if (!hasProv) {
      var score = scoreSiteField(site, fields[0] || "status", TODAY);
      out += discBlock("All fields", score, site, fields[0] || "status");
      out += '<p style="margin:.9rem 0 1rem;font-size:12px;color:var(--color-neutral-500)">Sources on this entry are not yet tied to individual facts, so each of them counts toward capacity, status and location alike.</p>';
    } else {
      out += fields.map(function(f){ return discBlock(FIELD_LABELS[f], scoreSiteField(site, f, TODAY), site, f); }).join('');
    }
    return out;
  }

  function renderSiteView(site){
    var color = colorFor(site.provider);
    var v = siteVerdict(site);

    var factsHtml =
      fact("Capacity", site.capacityMW != null ? site.capacityMW + ' MW' + basisHtml(site, "capacityMW") : '<span class="fact-muted">Not disclosed</span>') +
      fact("Status", '<span class="status-pill status-' + statusSlug(site.status) + '">' + esc(site.status) + '</span>') +
      fact("Location", esc(site.city) + ', ' + esc(site.country)) +
      fact("Coordinates", site.lat.toFixed(4) + ', ' + site.lon.toFixed(4)) +
      fact("Last checked", fmtDate(site.lastUpdated)) +
      fact("Sourcing", verdictInline(v));

    var sources = site.sources || [];
    var perField = scoredFields(site).some(function(f){ return siteFieldHasProvenance(site, f); });
    var sourcesHtml = sources.length
      ? sources.map(function(src){
          var cls = classifySource(src, site.provider);
          var backing = perField ? scoredFields(site).filter(function(f){
            return siteEvidenceFor(site, f).some(function(ev){ return ev.source === src; });
          }).map(function(f){ return FIELD_LABELS[f].toLowerCase(); }) : [];
          return '<li>' + classChip(cls) + '<div><a href="' + src.url + '" target="_blank" rel="noopener">' + esc(src.label) + '</a>' +
            '<div class="src-meta">' + esc(hostOf(src.url) || 'no url') + (backing.length ? ' · backs ' + backing.join(', ') : '') + '</div></div></li>';
        }).join('')
      : '<li><div class="fact-muted">No sources logged for this entry.</div></li>';

    var el = document.getElementById("viewSite");
    el.innerHTML = '<div class="wrap">' +
      '<button class="back-link">← Back to atlas</button>' +
      '<div class="s-head"><div><h1>' + esc(site.city) + '</h1><p class="s-sub">' + esc(site.site || site.country) + '</p></div>' +
        '<span class="provider-tag" style="background:' + color + '">' + esc(site.provider) + '</span></div>' +
      '<div class="s-facts">' + factsHtml + '</div>' +
      (site.notes && site.notes.length ? '<section class="s-block"><h2>What we know</h2><div class="s-prose">' + esc(site.notes) + '</div></section>' : '') +
      '<section class="s-block"><h2>Sources' + (sources.length ? ' (' + sources.length + ')' : '') + '</h2><ul class="src-list">' + sourcesHtml + '</ul></section>' +
      '<details class="site-disclosure"><summary><span class="disc-chevron" aria-hidden="true">›</span><span>How solid is this? ' + verdictInline(v) + '</span></summary>' +
        '<div class="disc-body">' + renderDisclosure(site) + '</div>' +
      '</details>' +
    '</div>';

    el.querySelector(".back-link").addEventListener("click", function(){ switchMainView("atlas"); });
  }

  function openSiteView(id){
    var site = SITES.filter(function(s){ return s.id === id; })[0];
    if (!site) return;
    renderSiteView(site);
    switchMainView("site");
  }

  // ════════════════════════════════════════════════════════════════════
  // View switching — Atlas (map+panel+inspector) vs. the two full-screen
  // overlays (Sources & method, site page). The rail is the navigation.
  // ════════════════════════════════════════════════════════════════════
  var ATLAS_PARTS = ["panel", "detail", "mapwrap"];
  var OVERLAYS = { sources: "viewSourcesMethod", site: "viewSite" };
  var currentView = "atlas";

  function switchMainView(view){
    currentView = view;
    var onAtlas = view === "atlas";
    ATLAS_PARTS.forEach(function(id){ document.getElementById(id).style.visibility = onAtlas ? "visible" : "hidden"; });
    Object.keys(OVERLAYS).forEach(function(key){
      document.getElementById(OVERLAYS[key]).classList.toggle("on", view === key);
    });
    document.querySelectorAll("#rail button[data-view]").forEach(function(b){
      var isSources = b.getAttribute("data-view") === "sources";
      b.setAttribute("aria-current", String((isSources && view === "sources") || (!isSources && onAtlas)));
    });
    if (view === "sources") renderSourcesMethodView();
    window.scrollTo(0, 0);
  }

  document.querySelectorAll("#rail button[data-view]").forEach(function(b){
    b.addEventListener("click", function(){ switchMainView(b.getAttribute("data-view") === "sources" ? "sources" : "atlas"); });
  });

  // applier boxes have to be kept in step with the auto-apply policy in
  // CLAUDE.md by hand.

  var PIPELINE_SVG = '<svg viewBox="0 0 1280 830" role="img" aria-labelledby="pipelineTitle pipelineDesc">' +

    '<defs>' +
      '<marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6964"/></marker>' +

    '</defs>' +

    '<text class="sb" x="56" y="99">“re-check the Kristiansand entry”</text>' +

    '<text class="mn" x="336" y="134" fill="#86847f">→ research-agent</text>' +
    '<rect class="bx" x="630" y="44" width="270" height="104" rx="6"/>' +
    '<text class="nm" x="646" y="66">You, in chat</text>' +
    '<text class="sb" x="646" y="84">“what’s new about CoreWeave”</text>' +

    '<text class="sb" x="646" y="114">not fact-checking a site entry.</text>' +
    '<text class="mn" x="646" y="134" fill="#86847f">→ news-agent</text>' +

    '<text class="sb" x="56" y="320">Classes every source R/N/O/P/T/G/D/U, checks</text>' +
    '<text class="sb" x="56" y="334">cross-class corroboration and recency, assigns</text>' +

    '<text class="sb" x="466" y="306">Curates dated company-level</text>' +
    '<text class="sb" x="466" y="320">headlines. Does not verify any</text>' +
    '<text class="sb" x="466" y="334">site field, ever.</text>' +
    '<text class="sb" x="466" y="356">Output lands in data/news.js,</text>' +
    '<text class="sb" x="466" y="370">a separate track from site facts.</text>' +
    '<rect class="bx" x="720" y="204" width="180" height="192" rx="6" stroke-dasharray="4 3"/>' +
    '<text class="nm" x="736" y="226" fill="#a3a19b">monitor-agent</text>' +

    '<text class="sb" x="736" y="262">⟳ self-triggering, on a</text>' +

    '<text class="sb" x="736" y="306">Diffs the structured</text>' +
    '<text class="sb" x="736" y="320">feeds in code, then shows</text>' +
    '<text class="sb" x="736" y="334">the model only the rows</text>' +
    '<text class="sb" x="736" y="348">that changed.</text>' +
    '<text class="sb" x="736" y="370">Cost scales with drift,</text>' +
    '<text class="sb" x="736" y="384">not with site count.</text>' +
    '<path class="cn" d="M 235 396 L 235 432" marker-end="url(#arw)"/>' +
    '<path class="cn" d="M 575 396 L 575 432" marker-end="url(#arw)"/>' +
    '<path class="cn" d="M 810 396 L 810 432" marker-end="url(#arw)" stroke-dasharray="4 3"/>' +
    '<text class="lbl" x="248" y="418">a report</text>' +
    '<text class="lbl" x="588" y="418">a report</text>' +
    '<text class="bnd" x="40" y="430">3 · Applier</text>' +
    '<rect x="40" y="440" width="860" height="164" rx="6" fill="var(--surface-2)" stroke="var(--accent)" stroke-opacity="0.35" stroke-width="1"/>' +
    '<text class="nm" x="56" y="464">Main Claude session — the applier</text>' +
    '<text class="sb" x="56" y="482">The only thing in this diagram holding Write, Edit and git. The subagents hand it a report; it applies what the evidence supports.</text>' +
    '<text class="sb" x="56" y="497">No human review gate: doubt goes into the data as a verdict, not into an inbox. Fabrication is caught earlier, by the adversarial second pass in research-agent.</text>' +
    '<rect x="56" y="510" width="410" height="78" rx="5" fill="rgba(74,222,128,0.07)" stroke="rgba(74,222,128,0.35)"/>' +
    '<text class="nm" x="70" y="531" fill="#4ADE80">High · Medium</text>' +
    '<text class="sb" x="70" y="549">Write the value with its verdict — independently</text>' +
    '<text class="sb" x="70" y="563">verified or operator\'s word. Update lastUpdated,</text>' +
    '<text class="sb" x="70" y="579">sources and provenance; commit, push. Never lower a verdict.</text>' +
    '<rect x="480" y="510" width="404" height="78" rx="5" fill="rgba(251,191,36,0.06)" stroke="rgba(251,191,36,0.32)"/>' +
    '<text class="nm" x="494" y="531" fill="#FBBF24">Low · conflicting · unverifiable</text>' +
    '<text class="sb" x="494" y="549">Low: written only into an empty field, else a lead in notes.</text>' +
    '<text class="sb" x="494" y="563">Conflicting: no value; both claims dated in notes.</text>' +
    '<text class="sb" x="494" y="579">Unverifiable: nothing written; what was searched is logged.</text>' +
    '<path class="cn" d="M 470 604 L 470 638" marker-end="url(#arw)"/>' +

    '<text class="mn" x="54" y="668" fill="var(--accent)">data/sites.js</text>' +

    '<text class="sb" x="54" y="699">per-field provenance.</text>' +
    '<rect class="bx" x="258" y="646" width="204" height="62" rx="6"/>' +
    '<text class="mn" x="272" y="668" fill="var(--accent)">data/providers.js</text>' +

    '<text class="sb" x="272" y="699">partnerships.</text>' +
    '<rect class="bx" x="476" y="646" width="204" height="62" rx="6"/>' +
    '<text class="mn" x="490" y="668" fill="var(--accent)">data/news.js</text>' +

    '<text class="sb" x="490" y="699">from news-agent.</text>' +
    '<rect x="694" y="646" width="206" height="62" rx="6" fill="var(--surface-2)" stroke="var(--accent)" stroke-opacity="0.5" stroke-dasharray="4 3"/>' +
    '<text class="mn" x="708" y="668" fill="var(--accent)">data/sources.js</text>' +
    '<text class="sb" x="708" y="686">The shared ruleset.</text>' +
    '<text class="sb" x="708" y="699">Not a stage in the flow.</text>' +
    '<path class="cnd" d="M 900 662 L 920 662 L 920 416 L 22 416 L 22 300 L 36 300" marker-end="url(#arwd)"/>' +
    '<text class="lbla" x="330" y="410">how to class a source · what counts as corroboration · staleness windows</text>' +
    '<path class="cnd" d="M 797 708 L 797 744" marker-end="url(#arwd)"/>' +
    '<text class="lbla" x="808" y="730">scores every entry, in the browser</text>' +
    '<path class="cn" d="M 350 708 L 350 744" marker-end="url(#arw)"/>' +
    '<rect class="bx" x="40" y="750" width="860" height="56" rx="6"/>' +
    '<text class="nm" x="56" y="774">index.html</text>' +
    '<text class="sb" x="56" y="793">Map, rail, site drawer, detail panel, Sources &amp; method page. Scoring runs client-side, so rendering this costs no tokens at all.</text>' +
    '</svg>';

  // ---- Boot ----------------------------------------------------------------
  renderRail();
  renderRows();
  setPanelView("operators");
  document.getElementById("statusMeta").textContent =
    SITES.length + " sites · " + providerOrder.length + " operators · updated " + fmtDate(SITES.reduce(function(m, x){ return (x.lastUpdated || "") > m ? x.lastUpdated : m; }, ""));
  document.getElementById("footMW").textContent = mwFmt(SITES.reduce(function(t, x){ return t + (x.capacityMW || 0); }, 0)) + " MW disclosed";
  document.getElementById("footCount").textContent = plural(SITES.length, "site") + " · " + plural(providerOrder.length, "operator");

})();
</script>
