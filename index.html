<meta charset="UTF-8">
<title>Site Atlas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css">
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script src="data/sites.js"></script>
<script src="data/providers.js"></script>
<script src="data/news.js"></script>
<script src="data/sources.js"></script>

<style>
  /* ════════════════════════════════════════════════════════════════════
     Nocturne tokens — this page always renders dark, regardless of OS/
     browser setting. Values transcribed from the design system; kept
     inline since the project has no build step (see CLAUDE.md).
     ════════════════════════════════════════════════════════════════ */
  :root{
    --color-bg:#161826;
    --color-surface:#232532;
    --color-text:#e9e9ed;
    --color-accent:#9184d9;
    --color-accent-2:#a7a1db;
    --color-divider: color-mix(in srgb, #e9e9ed 16%, transparent);

    --color-neutral-100:#f3f5fe; --color-neutral-200:#e4e7f5; --color-neutral-300:#cfd3e5;
    --color-neutral-400:#b2b6ca; --color-neutral-500:#9397ab; --color-neutral-600:#75798c;
    --color-neutral-700:#595d6c; --color-neutral-800:#3f424d; --color-neutral-900:#292b31;

    --color-accent-100:#f5f4ff; --color-accent-200:#e7e5fe; --color-accent-300:#d2cefd;
    --color-accent-400:#b5abfc; --color-accent-500:#968ae0; --color-accent-600:#796cbf;
    --color-accent-700:#5d5294; --color-accent-800:#423a6a; --color-accent-900:#2b2741;

    --font-heading:"Inter", system-ui, sans-serif;
    --font-body:"Inter", system-ui, sans-serif;
    /* Display serif — the masthead only. High-contrast editorial face; the
       rest of the UI stays on Inter so the wordmark reads as a wordmark
       rather than as a theme. */
    --font-display:"Instrument Serif", "Iowan Old Style", Georgia, "Times New Roman", serif;

    /* Height the floating chrome (rail, dashboard, detail card) clears to sit
       below the top bar. The bar is one row of tabs now that the masthead has
       moved down into the rail, so this is measured from that, not guessed. */
    --top-offset:52px;

    /* Rail + panel geometry.
       The provider panel opens like a drawer: the operator list slides to the
       right and the dashboard is revealed in the space it vacates, with the
       list ending up docked against the dashboard's right edge as its tab
       column. The rail's buttons are inset --tab-inset from its own left edge
       so shifting the rail by (panel width - that inset) lands the active
       operator's left edge exactly on the panel's right edge. The tab handles
       now bleed all the way to the rail's own left edge, so the inset is zero
       and the rail travels exactly the card's width — which is what stops a
       lighter strip being left over between handle and card. */
    --rail-w:272px;
    --panel-w:520px;
    --tab-inset:0px;
    --rail-shift:calc(var(--panel-w) - var(--tab-inset));

    --space-1:2.8px; --space-2:5.6px; --space-3:8.4px; --space-4:11.2px; --space-6:16.8px; --space-8:22.4px;
    --radius-sm:4px; --radius-md:8px; --radius-lg:14px;
    --shadow-md:0 0 0 1px #595d6c, 0 6px 18px rgba(0,0,0,.55);
    --shadow-lg:0 0 0 1px #9397ab, 0 16px 40px rgba(0,0,0,.65);

    /* Compat aliases — the ported detail/method/provider/site component CSS
       below (and the hand-tuned pipeline SVG's own inline <style>) was
       written against these names. Aliasing lets that CSS keep working
       unchanged against the new palette instead of a line-by-line port. */
    --bg: var(--color-bg);
    --surface: var(--color-surface);
    --surface-2: #1c1e2b;
    --border: var(--color-divider);
    --ink: var(--color-text);
    --ink-soft: var(--color-neutral-400);
    --accent: var(--color-accent);
    --accent-soft: color-mix(in srgb, var(--color-accent) 16%, transparent);
    --radius: var(--radius-md);
    --font-sans: var(--font-body);
    --font-mono: var(--font-heading);
  }

  *, *::before, *::after{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html, body{ height:100%; }
  body{
    margin:0; overflow:hidden;
    background:var(--color-bg); color:var(--color-text);
    font-family:var(--font-body); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{ background:var(--accent-soft); color:var(--ink); }
  a{ color:var(--accent); text-decoration-color:color-mix(in srgb, var(--accent) 40%, transparent); }
  a:hover{ text-decoration-color:currentColor; }
  h1,h2,h3,h4{ font-family:var(--font-heading); font-weight:500; letter-spacing:-0.015em; margin:0; }

  /* --shoulder: the dark band across the top of the operator dashboard,
     measured from the masthead's rule in JS (see setShoulder) so the card's
     lighter field begins on exactly that line. */
  #shell{ position:relative; height:100vh; min-height:560px; --shoulder:0px; }

  /* ---- sky ----
     The globe's canvas is transparent everywhere outside the sphere, and its
     atmosphere shader blends into whatever is behind it — so a layer underneath
     the map reads as the space the globe is sitting in, halo and all. Kept
     outside #mapwrap on purpose: the map slides sideways when the dashboard
     opens and the sky does not, which gives the globe a little parallax against
     a fixed field of stars. */
  #sky{ position:absolute; inset:0; z-index:0; overflow:hidden; pointer-events:none;
    background:
      /* two very restrained washes, so the field isn't a flat black rectangle */
      radial-gradient(60% 55% at 18% 12%, color-mix(in srgb, var(--color-accent) 13%, transparent) 0%, transparent 70%),
      radial-gradient(52% 48% at 88% 82%, color-mix(in srgb, #4FC2C9 8%, transparent) 0%, transparent 72%),
      radial-gradient(120% 90% at 50% 45%, #12131f 0%, #0b0c14 55%, #07070d 100%);
  }
  #starfield{ position:absolute; inset:0; display:block; width:100%; height:100%; }

  /* the map is the page; everything else floats over it */
  /* With the dashboard open the left of the window is covered, so the globe is
     slid right by half the covered width — that puts its centre in the middle
     of what's actually visible. The canvas keeps its full size and is only
     transformed, so this is a compositor move: no resize, no reprojection, and
     the click target stays under the pixel the user is looking at. The strip it
     vacates on the left is narrower than the dashboard covering it, and the
     overhang on the right is clipped by body's overflow, so nothing tears. */
  #mapwrap{
    position:absolute; inset:0; --map-shift:0px;
    transform:translateX(var(--map-shift));
    transition:transform .42s cubic-bezier(.22,.68,.32,1);
  }
  #mapwrap.no-anim{ transition:none; }
  /* Attribution would ride off the right edge with everything else. It has to
     stay readable, so it's pushed back by the same amount. */
  #mapwrap .maplibregl-ctrl-bottom-right{ transform:translateX(calc(-1 * var(--map-shift))); }
  /* Transparent, not the old flat navy — the sky behind it is the background
     now, and an opaque colour here would hide it. */
  #map{ width:100%; height:100%; display:block; background:transparent; }
  .maplibregl-ctrl-attrib{ font-size:10px !important; }
  .map-loading{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font:500 12px var(--font-heading); letter-spacing:.08em; text-transform:uppercase; color:var(--color-neutral-500);
    pointer-events:none;
  }
  #rail::-webkit-scrollbar, .rows::-webkit-scrollbar{ width:6px; }
  #rail::-webkit-scrollbar-thumb, .rows::-webkit-scrollbar-thumb{ background:var(--color-neutral-800); border-radius:3px; }

  .fade-x{ background:linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent); height:1px; }
  .hr{ height:1px; border:0; margin:var(--space-4) 0; background:linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent); }

  /* ---- top bar ---- */
  #bar{
    position:absolute; top:0; left:0; right:0; z-index:50;
    display:flex; align-items:baseline; gap:var(--space-8);
    padding:var(--space-6) var(--space-8) var(--space-4);
    background:linear-gradient(to bottom, rgba(22,24,38,.92) 0%, rgba(22,24,38,.86) 45%, rgba(22,24,38,0) 100%);
  }
  #bar::after{ content:""; position:absolute; left:var(--space-8); right:var(--space-8); bottom:0; height:1px;
    background:linear-gradient(to right, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent); }
  /* The masthead sits in the rail, directly above the operator tabs, rather
     than in the top bar — so the wordmark heads the column it belongs to and
     the bar is left as pure navigation. It travels with the rail when the
     dashboard opens, staying glued to the tabs it titles. */
  .brand{ display:flex; flex-direction:column; gap:var(--space-1); white-space:nowrap;
    font-family:var(--font-display); font-weight:400; font-size:30px; line-height:1.05; letter-spacing:.004em;
    padding-bottom:var(--space-4); margin-bottom:var(--space-6);
    border-bottom:1px solid var(--color-divider); }
  .brand span{ font:400 10.5px/1 var(--font-body); letter-spacing:.11em; text-transform:uppercase; color:var(--color-neutral-500); }
  /* Below the rail's breakpoint the rail is hidden outright, and the masthead
     with it — so a compact one takes its place back in the bar. Only ever one
     of the two is displayed, so neither is read out twice. */
  .brand-bar{ display:none; }
  nav.tabs{ display:flex; gap:var(--space-6); }
  nav.tabs button{
    appearance:none; background:none; border:0; cursor:pointer; padding:0 0 2px;
    font:500 13px/1 var(--font-heading); letter-spacing:.02em;
    color:var(--color-neutral-500); border-bottom:1px solid transparent;
  }
  nav.tabs button:hover{ color:var(--color-accent-300); }
  nav.tabs button[aria-current="true"]{ color:var(--color-text); border-bottom-color:var(--color-accent); }
  .bar-meta{ margin-left:auto; display:flex; align-items:baseline; gap:var(--space-4); font-size:11.5px; color:var(--color-neutral-500); letter-spacing:.02em; white-space:nowrap; }
  .bar-reset{
    appearance:none; background:none; border:0; cursor:pointer; padding:0;
    font:500 11.5px var(--font-heading); letter-spacing:.02em; color:var(--color-neutral-500);
  }
  .bar-reset:hover{ color:var(--color-accent-300); }

  /* ---- left rail ---- */
  #rail{
    position:absolute; z-index:30; top:var(--top-offset); bottom:222px; left:0; width:var(--rail-w);
    padding:var(--space-8); background:linear-gradient(to right, rgba(22,24,38,.94) 0%, rgba(22,24,38,.9) 62%, rgba(22,24,38,0) 100%);
    overflow-y:auto; overflow-x:hidden;
    transform:translateX(0);
    transition:transform .42s cubic-bezier(.22,.68,.32,1), background .3s ease, box-shadow .3s ease;
  }
  /* Open: the list slides right off the card it was covering. Dark ground,
     with a hairline where it meets the card's lighter field — the only mark on
     that join. Across the shoulder both sides are the same dark, so the
     hairline stops there and the band reads as one continuous piece. */
  #shell.panel-open #rail{
    transform:translateX(var(--rail-shift));
    background:
      linear-gradient(var(--color-bg), var(--color-bg)) no-repeat 0 0 / 100% var(--shoulder),
      linear-gradient(to right, var(--color-divider) 0, var(--color-divider) 1px, var(--color-bg) 1px, var(--color-bg) 100%);
    box-shadow:-16px 0 38px rgba(0,0,0,.42);
  }
  @media (prefers-reduced-motion: reduce){ #rail{ transition:background .3s ease; } }
  .eyebrow{ font:500 10.5px/1 var(--font-heading); letter-spacing:.12em; text-transform:uppercase; color:var(--color-neutral-500); }
  .stat-sub{ font-size:12px; color:var(--color-neutral-500); margin-top:var(--space-2); }

  .prov{ position:relative; display:grid; grid-template-columns:8px 1fr auto; align-items:center; gap:var(--space-2) var(--space-3);
    padding:var(--space-3) var(--space-2) var(--space-3) var(--space-8);
    margin:0 calc(var(--space-2) * -1) 0 calc(var(--space-8) * -1); border-radius:0 6px 6px 0;
    cursor:pointer; border:0; background:none; width:calc(100% + var(--space-8) + var(--space-2)); text-align:left; color:inherit;
    transition:background .12s ease; }
  .prov:hover{ background:color-mix(in srgb, var(--color-text) 5%, transparent); }
  .prov + .prov{ border-top:1px solid color-mix(in srgb, var(--color-text) 8%, transparent); }

  /* The open operator becomes the tab handle: same surface as the panel, square
     on the left where the two meet, hairline on the other three sides. The rail
     sits above the panel in z-order, so this paints across the join and the
     seam between list and dashboard disappears. */
  .prov.is-tab, .prov.is-tab:hover{
    background:var(--color-surface);
    border-radius:0 var(--radius-md) var(--radius-md) 0;
  }
  .prov.is-tab::before{
    content:""; position:absolute; inset:0; pointer-events:none;
    border:1px solid var(--color-divider); border-left:0;
    border-radius:0 var(--radius-md) var(--radius-md) 0;
    /* Dissolve the hairline as it approaches the dashboard. Both surfaces are
       --color-surface, so with the border gone the tab and the panel are one
       continuous field and the join disappears instead of being drawn. */
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 34px);
    mask-image:linear-gradient(to right, transparent 0, #000 34px);
  }
  .prov.is-tab + .prov, .prov:has(+ .prov.is-tab){ border-top-color:transparent; }
  .prov.is-tab .pname{ color:var(--color-accent-300); }
  .prov.is-tab .parrow{ opacity:1; max-width:1em; margin-left:5px; transform:translateX(0) rotate(0deg); }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .pname{ font:500 13.5px/1.2 var(--font-heading); display:inline-flex; align-items:center; transition:color .15s ease; }
  .pname:hover{ color:var(--color-accent-300); }
  .parrow{ display:inline-block; opacity:0; max-width:0; overflow:hidden; margin-left:0;
    transform:translateX(-3px); transition:opacity .16s ease, transform .16s ease, max-width .16s ease, margin-left .16s ease;
    font-size:11px; color:var(--color-accent-300); }
  .pname:hover .parrow{ opacity:1; max-width:1em; margin-left:5px; transform:translateX(0); }
  .pmw{ font-size:12px; color:var(--color-neutral-400); font-variant-numeric:tabular-nums; }
  .pbar{ grid-column:2 / span 2; height:2px; background:color-mix(in srgb, var(--color-text) 10%, transparent); }
  .pbar i{ display:block; height:2px; }
  .pcount{ grid-column:2 / span 2; font-size:11px; color:var(--color-neutral-500); margin-top:2px; }
  .prov[data-off="1"]{ opacity:.42; }

  .legend{ font-size:11.5px; color:var(--color-neutral-400); display:flex; flex-wrap:wrap; align-items:center; gap:var(--space-2) var(--space-6); }
  .legend div{ display:flex; align-items:center; gap:var(--space-2); }
  .lg{ width:9px; height:9px; border-radius:50%; flex:none; }

  /* ---- bottom drawer ---- */
  #drawer{
    position:absolute; z-index:25; left:0; right:0; bottom:0; height:218px;
    background:linear-gradient(to top, rgba(22,24,38,.96) 0%, rgba(22,24,38,.93) 55%, rgba(22,24,38,0) 100%);
    padding:var(--space-6) var(--space-8); display:flex; flex-direction:column;
  }
  #drawer .head{ display:flex; align-items:baseline; flex-wrap:wrap; gap:var(--space-2) var(--space-6); padding-bottom:var(--space-3); }
  .srch{ margin-left:auto; display:flex; gap:var(--space-4); align-items:center; }
  .srch input{
    background:transparent; border:0; border-bottom:1px solid var(--color-divider);
    color:var(--color-text); font:400 12.5px var(--font-body); padding:3px 0; width:180px;
  }
  .srch input::placeholder{ color:var(--color-neutral-500); }
  .srch input:focus{ outline:none; border-bottom-color:var(--color-accent); }

  .seg{ display:inline-flex; overflow:hidden; border:1px solid var(--color-divider); border-radius:var(--radius-sm); }
  .seg button{
    appearance:none; background:none; border:0; cursor:pointer; padding:3px 10px;
    font:500 11px var(--font-heading); letter-spacing:.03em; color:var(--color-neutral-400);
  }
  .seg button + button{ border-left:1px solid var(--color-divider); }
  .seg button[aria-pressed="true"]{ color:var(--color-accent-300); background:color-mix(in srgb, var(--color-accent) 14%, transparent); }
  .seg button:not([aria-pressed="true"]):hover{ color:var(--color-text); }

  .rows{ overflow-y:auto; margin-right:-8px; padding-right:8px; }
  .row{
    display:grid; grid-template-columns:10px minmax(150px,1.3fr) minmax(120px,1fr) 132px 84px minmax(150px,.9fr);
    align-items:center; gap:var(--space-6); width:100%; text-align:left;
    padding:7px 0; background:none; border:0; border-top:1px solid color-mix(in srgb, var(--color-text) 7%, transparent);
    color:inherit; cursor:pointer; font:400 12.5px/1.35 var(--font-body);
  }
  .row:hover{ background:color-mix(in srgb, var(--color-accent) 9%, transparent); }
  .row[aria-selected="true"]{ background:color-mix(in srgb, var(--color-accent) 14%, transparent); }
  .row .name{ font-weight:500; font-family:var(--font-heading); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .row .name:hover{ color:var(--color-accent-300); text-decoration:underline; }
  .row .place, .row .stat{ color:var(--color-neutral-400); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .cap{ text-align:right; font-variant-numeric:tabular-nums; }
  .hrow{ border:0; color:var(--color-neutral-500); font:500 10.5px/1 var(--font-heading); letter-spacing:.1em; text-transform:uppercase; padding-bottom:5px; cursor:default; }
  .hrow:hover{ background:none; }

  .vd{ display:inline-flex; align-items:center; gap:6px; font-size:11.5px; white-space:nowrap; }
  .vd i{ width:3px; height:12px; flex:none; display:block; }
  .vd.independent{ color:var(--color-accent-300); }
  .vd.independent i{ background:var(--color-accent); }
  .vd.operator{ color:var(--color-neutral-400); }
  .vd.operator i{ background:var(--color-neutral-600); }
  .vd.unsourced{ color:var(--color-neutral-500); }
  .vd.unsourced i{ background:repeating-linear-gradient(to bottom, var(--color-neutral-700) 0 2px, transparent 2px 4px); }

  /* ---- detail panel ---- */
  #detail{
    position:absolute; z-index:28; top:var(--top-offset); right:0; bottom:222px; width:372px;
    padding:var(--space-8); background:linear-gradient(to left, rgba(22,24,38,.96) 0%, rgba(22,24,38,.93) 70%, rgba(22,24,38,0) 100%);
    overflow-y:auto; display:none;
  }
  #detail.on{ display:block; }
  #detail::before{ content:""; position:absolute; left:0; top:24px; bottom:24px; width:1px;
    background:linear-gradient(to bottom, transparent, var(--color-divider) 48px, var(--color-divider) calc(100% - 48px), transparent); }
  .dclose{ position:absolute; top:var(--space-6); right:var(--space-6); background:none; border:0; color:var(--color-neutral-500); cursor:pointer; font-size:15px; }
  .dclose:hover{ color:var(--color-text); }
  .d-op{ display:flex; align-items:center; gap:var(--space-3); font:500 12px var(--font-heading); letter-spacing:.04em; text-transform:uppercase; cursor:pointer; width:fit-content; }
  .d-op:hover .d-op-name{ color:var(--color-accent-300); }
  .d-op .dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .d-title{ font:500 24px/1.15 var(--font-heading); letter-spacing:-.02em; margin:var(--space-3) 0 var(--space-2); cursor:pointer; }
  .d-title:hover{ color:var(--color-accent-300); }
  .d-place{ font-size:13px; color:var(--color-neutral-400); }
  .fields{ margin-top:var(--space-8); display:grid; gap:var(--space-6); }
  .field{ display:grid; gap:3px; }
  .field .k{ font:500 10.5px/1 var(--font-heading); letter-spacing:.12em; text-transform:uppercase; color:var(--color-neutral-500); }
  .field .v{ font:500 18px/1.25 var(--font-heading); display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; }
  .conf-why{ margin-top:var(--space-6); padding:var(--space-3) var(--space-4); background:color-mix(in srgb, var(--color-text) 5%, transparent); border-left:2px solid var(--color-divider); border-radius:0 6px 6px 0; font-size:12px; line-height:1.5; color:var(--color-neutral-400); }
  .d-notes{ margin-top:var(--space-6); padding:var(--space-3) var(--space-4); border:1px dashed var(--color-divider); border-radius:8px; font-size:12.5px; font-style:italic; color:var(--color-neutral-400); line-height:1.55; }
  .srcs{ margin-top:var(--space-8); }
  .src{ display:grid; grid-template-columns:22px 1fr; gap:var(--space-4); padding:var(--space-3) 0; border-top:1px solid color-mix(in srgb, var(--color-text) 7%, transparent); font-size:12px; }
  .cls{ font:500 10px/16px var(--font-heading); text-align:center; border:1px solid var(--color-neutral-700); color:var(--color-neutral-300); border-radius:3px; }
  .cls.ind{ border-color:var(--color-accent-600); color:var(--color-accent-300); }
  .src .sl{ color:var(--color-neutral-300); }
  .src .sm{ color:var(--color-neutral-500); font-size:11px; }
  .d-updated{ margin-top:var(--space-6); font-size:11px; color:var(--color-neutral-500); }

  /* ---- confidence dot (hover-revealed graded level, beside the verdict) ---- */
  .conf-badge{
    display:inline-flex; align-items:center;
    height:15px; padding:0 3px; border-radius:999px;
    vertical-align:middle; cursor:help;
    background:transparent; border:1px solid transparent;
    color:var(--conf-fg);
    transition:background .16s ease, border-color .16s ease, padding .16s ease;
  }
  .conf-badge::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; flex:0 0 auto; }
  .conf-badge .conf-label{ max-width:0; opacity:0; margin-left:0; overflow:hidden; white-space:nowrap; font-size:.66rem; font-weight:600; letter-spacing:.02em; transition:max-width .18s ease, opacity .14s ease, margin-left .18s ease; }
  .conf-badge:hover, .conf-badge:focus-visible{ background:var(--conf-bg); border-color:var(--conf-bd); padding:0 .5rem 0 .35rem; }
  .conf-badge:hover .conf-label, .conf-badge:focus-visible .conf-label{ max-width:7rem; opacity:1; margin-left:.32rem; }
  .conf-badge:focus-visible{ outline:1px solid var(--conf-bd); outline-offset:2px; }

  .basis-tag{ font:500 10px var(--font-heading); text-transform:uppercase; letter-spacing:.06em; color:var(--color-neutral-500); }
  .basis-tag.basis-derived, .basis-tag.basis-estimated{ color:#FBBF24; }

  .status-pill{ display:inline-flex; align-items:center; gap:.4rem; font:500 12px var(--font-heading); letter-spacing:.01em; }
  .status-pill::before{ content:""; width:6px; height:6px; border-radius:50%; background:currentColor; flex-shrink:0; }
  .status-operational{ color:#4ADE80; }
  .status-under-construction{ color:#FBBF24; }
  .status-planned{ color:#94A3B8; }

  /* ---- provider tag ---- */
  .provider-tag{
    font:600 11px var(--font-heading); letter-spacing:.05em; text-transform:uppercase;
    padding:.22rem .55rem; border-radius:5px; color:#131420; white-space:nowrap;
  }

  /* ---- pins ---- */
  .pin-marker{ width:44px; height:44px; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .pin-marker.dim{ display:none; }
  .pin-core{ border-radius:50%; transition:transform .15s ease; box-sizing:border-box; }
  .pin-marker.pin-status-operational .pin-core{ background:var(--dot); border:1.4px solid #0e0f1a; }
  .pin-marker.pin-status-under-construction .pin-core{ background:color-mix(in srgb, var(--dot) 22%, transparent); border:1.6px solid var(--dot); }
  .pin-marker.pin-status-planned .pin-core{ background:transparent; border:1.3px dashed var(--dot); }
  .pin-marker:hover .pin-core, .pin-marker:focus .pin-core, .pin-marker.active .pin-core{ transform:scale(1.22); }
  .pin-halo{ position:absolute; width:100%; height:100%; border-radius:50%; background:var(--dot); opacity:0; transition:opacity .15s ease; pointer-events:none; }
  .pin-marker:hover .pin-halo, .pin-marker:focus .pin-halo, .pin-marker.active .pin-halo{ opacity:.24; }
  .pin-marker:hover, .pin-marker:focus{ z-index:10; }
  .pin-pulse{ position:absolute; border-radius:50%; border:2px solid var(--dot); opacity:0; pointer-events:none; }
  .pin-marker.pin-status-operational .pin-pulse{ animation:pin-pulse 2.4s cubic-bezier(.2,.6,.4,1) infinite; }
  @keyframes pin-pulse{ 0%{ transform:scale(1); border-width:3px; opacity:.55; } 100%{ transform:scale(2.4); border-width:.5px; opacity:0; } }
  @media (prefers-reduced-motion: reduce){ .pin-marker.pin-status-operational .pin-pulse{ animation:none; display:none; } }

  .pin-label{
    position:absolute; bottom:calc(100% + 4px); left:50%; transform:translateX(-50%);
    display:flex; flex-direction:column; align-items:center; gap:.1rem;
    padding:.35rem .55rem; border-radius:6px; background:var(--color-surface); border:1px solid var(--color-divider);
    white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s ease; z-index:5;
  }
  .pin-marker:hover .pin-label, .pin-marker:focus .pin-label{ opacity:1; }
  .pin-label-name{ font-size:.76rem; font-weight:600; color:var(--color-text); line-height:1.2; }
  .pin-label-cap{ font-size:.7rem; color:var(--color-neutral-400); line-height:1.2; font-variant-numeric:tabular-nums; }

  /* ---- full-screen overlay views (Sources & method / provider / site) ---- */
  .ov{ position:absolute; inset:0; z-index:40; background:var(--color-bg); overflow-y:auto; display:none; padding:96px var(--space-8) 96px; }
  .ov.on{ display:block; }

  /* ---- provider panel ----
     Docks to the right edge of the rail's buttons and unfurls horizontally,
     so the operator list reads as a tab column and the open operator as the
     tab handle attached to it. Animated with clip-path rather than transform
     so the panel genuinely *expands* from the tab edge instead of sliding in
     from off-screen — the shadow sweeps out with it. */
  /* The dock is a fixed window onto the dashboard; the panel slides inside it.
     Everything past --panel-w is clipped here rather than on the panel, so the
     panel itself only ever animates transform. */
  #providerDock{
    position:absolute; z-index:26; top:var(--top-offset); bottom:222px; left:0;
    width:var(--panel-w); overflow:hidden; pointer-events:none;
  }
  #providerDock.on{ pointer-events:auto; }
  #providerPanel{
    position:absolute; inset:0;
    /* The band across the top is --shoulder tall, taken from the masthead's own
       rule so the card's lighter field starts on that exact line and the band
       reads as one piece over card and tabs alike.
       The card's ground has to END on exactly the fill the tab handle is
       painted in, or the join is a colour step no radius can hide — so the
       gradient resolves to --color-surface well before the right edge and only
       darkens away from the seam, leftward. */
    background:
      linear-gradient(var(--color-bg), var(--color-bg)) no-repeat 0 0 / 100% var(--shoulder),
      linear-gradient(to right, #1e202d 0%, var(--color-surface) 62%, var(--color-surface) 100%);
    /* The band is real estate, not padding: the operator's name sits in it and
       the scroller starts below it, so content can never ride up onto the dark
       ground or under the close button. */
    display:flex; flex-direction:column;
    /* Revealed, not flown in. The panel and the rail translate by the SAME
       distance on the SAME curve, so the panel's right edge stays glued to the
       active operator's tab edge for every frame of the motion — the dashboard
       reads as something the list was sitting on top of. Both are transforms so
       both run on the compositor; animating one of them as clip-path or width
       put it on the main thread, where a busy frame (the map redrawing, say)
       desynced it from the rail and tore the seam open. */
    transform:translateX(calc(-1 * var(--rail-shift)));
    transition:transform .42s cubic-bezier(.22,.68,.32,1);
  }
  #providerDock.on #providerPanel{ transform:translateX(0); }
  @media (prefers-reduced-motion: reduce){ #providerPanel{ transition:none; } }
  /* One rule where the shoulder ends and the card's field begins — collinear
     with the masthead's rule in the tab column, so a single line crosses the
     whole dashboard instead of two meeting near the seam. The panel's own top
     edge carries nothing. */
  #providerPanel::before, #providerPanel::after{
    content:""; position:absolute; left:0; right:0; height:1px; pointer-events:none; z-index:3;
    background:linear-gradient(to right, transparent 0, var(--color-divider) 56px, var(--color-divider) 100%);
  }
  #providerPanel::before{ top:var(--shoulder); }
  #providerPanel::after{ bottom:0; }
  /* The name is chrome, not content — it holds still in the shoulder while the
     card scrolls under it. */
  .pp-head{ flex:none; height:var(--shoulder); display:flex; align-items:center; gap:var(--space-3);
    padding:0 52px 0 var(--space-8); }
  .pp-head .dot{ width:11px; height:11px; border-radius:50%; flex:none; }
  .pp-head h1{ font-size:20px; letter-spacing:-.02em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  /* Scrollbar on the FAR LEFT. On the right it lands exactly on the seam with
     the operator tabs and cuts a grey stripe through the join. direction:rtl
     moves the scrollbar to the other edge; the content is flipped back to ltr
     one level down so nothing else about the layout changes. */
  .pp-body{ flex:1; min-height:0; overflow-y:auto; overflow-x:hidden;
    padding:var(--space-6) var(--space-8) 56px; direction:rtl; }
  .pp-body > *{ direction:ltr; }
  .pp-body::-webkit-scrollbar{ width:6px; }
  .pp-body::-webkit-scrollbar-thumb{ background:var(--color-neutral-800); border-radius:3px; }
  /* Sits in the shoulder, beside the name, clear of the card's content. */
  .pp-close{
    position:absolute; top:calc(var(--shoulder) / 2 - 13px); right:var(--space-6); z-index:2;
    background:none; border:0; cursor:pointer; padding:var(--space-2);
    line-height:1; font-size:15px; color:var(--color-neutral-500); border-radius:var(--radius-sm);
  }
  .pp-close:hover{ color:var(--color-text); background:color-mix(in srgb, var(--color-text) 7%, transparent); }

  /* The provider markup was written for a 1040px full-screen page; inside a
     ~520px panel it collapses to a single column. Content is unchanged. */
  #providerPanel .wrap{ max-width:none; }
  #providerPanel .p-body{ gap:36px; }
  .wrap{ max-width:1040px; margin:0 auto; }
  .lede{ font-size:15px; color:var(--color-neutral-300); max-width:66ch; }
  .back-link{ background:none; border:0; color:var(--color-neutral-500); font:500 12px var(--font-heading); letter-spacing:.03em; cursor:pointer; padding:0 0 var(--space-6); display:block; }
  .back-link:hover{ color:var(--color-accent-300); }
  .plink{ cursor:pointer; }
  .plink:hover{ color:var(--color-accent-300); }

  .tally{ display:flex; align-items:baseline; gap:var(--space-4); margin:var(--space-8) 0 var(--space-4); flex-wrap:wrap; }
  .tally b{ font:500 56px/1 var(--font-heading); letter-spacing:-.035em; }
  .tally span{ font-size:14px; color:var(--color-neutral-400); max-width:34ch; }
  .meter{ display:flex; height:6px; max-width:620px; margin-bottom:var(--space-3); border-radius:3px; overflow:hidden; }
  .meter i:nth-child(1){ background:var(--color-accent); }
  .meter i:nth-child(2){ background:var(--color-neutral-700); }
  .meter i:nth-child(3){ background:repeating-linear-gradient(to right, var(--color-neutral-800) 0 3px, transparent 3px 6px); }

  .band{ margin:56px 0 var(--space-8); }
  .band h4{ font-size:20px; margin-bottom:var(--space-2); }
  .band p{ color:var(--color-neutral-400); font-size:13px; max-width:70ch; margin:0; }

  .classes{ display:grid; gap:0; margin-top:var(--space-6); }
  .cl{ display:grid; grid-template-columns:26px 200px 1fr; gap:var(--space-6); align-items:baseline;
    padding:var(--space-4) 0; border-top:1px solid color-mix(in srgb, var(--color-text) 8%, transparent); }
  .cl .code{ font:500 12px/22px var(--font-heading); text-align:center; border:1px solid var(--color-neutral-700); color:var(--color-neutral-300); border-radius:3px; }
  .cl.ind .code{ border-color:var(--color-accent-600); color:var(--color-accent-300); }
  .cl .lab{ font:500 14px var(--font-heading); }
  .cl .bl{ font-size:12.5px; color:var(--color-neutral-400); }

  table.table{ width:100%; border-collapse:collapse; font-size:13.5px; margin-top:var(--space-4); }
  table.table th{ text-align:left; font:500 10.5px var(--font-heading); letter-spacing:.08em; text-transform:uppercase; color:var(--color-neutral-500); padding:var(--space-2) var(--space-3) var(--space-2) 0; }
  table.table td{ padding:var(--space-3) var(--space-3) var(--space-3) 0; vertical-align:top; }
  table.table thead tr{ background:linear-gradient(to right, transparent, var(--color-divider) 0, var(--color-divider) 100%, transparent) no-repeat bottom / 100% 1px; }
  table.table tbody tr{ background:linear-gradient(to right, transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 0, color-mix(in srgb, var(--color-text) 8%, transparent) 100%, transparent) no-repeat bottom / 100% 1px; }
  table.table tbody tr:hover{ background: linear-gradient(color-mix(in srgb, var(--color-text) 4%, transparent), color-mix(in srgb, var(--color-text) 4%, transparent)) no-repeat 0 0/100% 100%, linear-gradient(to right, transparent, color-mix(in srgb, var(--color-text) 8%, transparent) 0, color-mix(in srgb, var(--color-text) 8%, transparent) 100%, transparent) no-repeat bottom / 100% 1px; }
  .ch-name{ font-weight:500; }
  .ch-gives{ color:var(--color-neutral-400); font-size:12.5px; line-height:1.5; max-width:44ch; }
  .ch-meta{ font-size:12px; color:var(--color-neutral-400); white-space:nowrap; }
  .cls-cell{ width:26px; }

  .rule-list{ list-style:none; margin:var(--space-4) 0 0; padding:0; display:flex; flex-direction:column; gap:var(--space-3); }
  .rule-list li{ display:grid; grid-template-columns:6.5rem 1fr; gap:var(--space-6); align-items:baseline;
    background:var(--color-surface); border:1px solid var(--color-divider); border-radius:8px; padding:var(--space-3) var(--space-4);
    font-size:12.5px; line-height:1.55; color:var(--color-neutral-400); }
  .rule-list li strong{ color:var(--color-text); }

  .tally-row{ display:flex; flex-wrap:wrap; gap:var(--space-3); margin:var(--space-4) 0 0; }
  .tally-card{ background:var(--color-surface); border:1px solid var(--color-divider); border-top:2px solid var(--tc); border-radius:8px; padding:var(--space-3) var(--space-4); min-width:8.5rem; }
  .tally-value{ font:500 26px var(--font-heading); color:var(--tc); }
  .tally-label{ font-size:11.5px; color:var(--color-neutral-500); margin-top:2px; }

  .method-figure{ background:var(--color-surface); border:1px solid var(--color-divider); border-radius:var(--radius-lg); padding:20px; overflow-x:auto; margin-top:var(--space-4); }
  .method-figure svg{ display:block; min-width:940px; width:100%; height:auto; }

  /* ---- operator card content ---- */
  .p-summary{ margin:var(--space-4) 0 0; font-size:13.5px; line-height:1.62;
    color:var(--color-neutral-300); max-width:60ch; }

  /* Headline figure. One number the tab already showed, taken apart. The split
     bar and its key use the map's own pin treatments — filled, ringed, dashed —
     so the card reads as a close-up of the pins, not a second chart language. */
  .p-figure{ margin-top:var(--space-8); }
  .p-cap{ display:flex; align-items:baseline; gap:var(--space-3); }
  .p-cap b{ font:500 42px/1 var(--font-heading); letter-spacing:-.035em; font-variant-numeric:tabular-nums; }
  .p-cap em{ font-style:normal; font:500 11px var(--font-heading); letter-spacing:.09em; text-transform:uppercase; color:var(--color-neutral-500); }
  .p-cap-meta{ margin-top:var(--space-3); font-size:12px; color:var(--color-neutral-500); }
  .p-split{ display:flex; gap:3px; height:9px; margin-top:var(--space-6); }
  .p-split i{ display:block; min-width:3px; border-radius:2px; box-sizing:border-box; }
  .p-split i.s-operational{ background:var(--pc); }
  .p-split i.s-under-construction{ background:color-mix(in srgb, var(--pc) 24%, transparent); border:1.4px solid var(--pc); }
  .p-split i.s-planned{ background:transparent; border:1.3px dashed color-mix(in srgb, var(--pc) 70%, transparent); }
  .p-key{ list-style:none; margin:var(--space-4) 0 0; padding:0;
    display:grid; grid-template-columns:repeat(auto-fit, minmax(108px,1fr)); gap:var(--space-4); }
  .p-key li{ display:grid; grid-template-rows:2.3em auto auto; gap:2px; padding-top:var(--space-3);
    border-top:1px solid color-mix(in srgb, var(--color-text) 10%, transparent); }
  .p-key .kl{ display:flex; align-items:flex-start; gap:5px; font:500 10px/1.25 var(--font-heading); letter-spacing:.07em; text-transform:uppercase; color:var(--color-neutral-500); }
  .p-key .sw{ width:9px; height:9px; border-radius:50%; flex:none; box-sizing:border-box; margin-top:2px; }
  .p-key .sw.s-operational{ background:var(--pc); }
  .p-key .sw.s-under-construction{ background:color-mix(in srgb, var(--pc) 24%, transparent); border:1.4px solid var(--pc); }
  .p-key .sw.s-planned{ border:1.2px dashed color-mix(in srgb, var(--pc) 70%, transparent); }
  .p-key .kv{ font:500 15px var(--font-heading); font-variant-numeric:tabular-nums; }
  .p-key .kn{ font-size:11.5px; color:var(--color-neutral-500); }

  /* Evidence strip — the drawer's weakest-link verdict, tallied per operator. */
  .p-ev{ margin-top:var(--space-8); }
  .p-ev-meter{ display:flex; gap:3px; height:4px; margin:var(--space-3) 0; }
  .p-ev-meter i{ display:block; min-width:3px; }
  .p-ev-meter i.independent{ background:var(--color-accent); }
  .p-ev-meter i.operator{ background:var(--color-neutral-700); }
  .p-ev-meter i.unsourced{ background:repeating-linear-gradient(to right, var(--color-neutral-700) 0 3px, transparent 3px 6px); }
  .p-ev-key{ display:flex; flex-wrap:wrap; gap:var(--space-2) var(--space-6); }
  .p-ev-key .vd b{ font-weight:500; font-variant-numeric:tabular-nums; }

  /* One column, read top to bottom: who they are, who they work with, what's
     happened lately, and only then the site-by-site list — which is the long
     part, and the part the map is already showing. */
  .p-body{ display:grid; grid-template-columns:minmax(0,1fr); gap:40px; margin-top:var(--space-8); }
  .p-section h2{ font:500 10.5px/1 var(--font-heading); letter-spacing:.12em; text-transform:uppercase;
    color:var(--color-neutral-500); margin-bottom:var(--space-4); }
  .p-locations{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .p-loc-item{ display:flex; align-items:center; gap:var(--space-3); padding:.4rem 0; font-size:13px; cursor:pointer;
    border-top:1px solid color-mix(in srgb, var(--color-text) 7%, transparent); }
  .p-loc-item:first-child{ border-top:0; }
  .p-loc-item:hover{ color:var(--color-accent-300); }
  .p-loc-name{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p-loc-place{ color:var(--color-neutral-500); font-size:12px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .p-loc-cap{ color:var(--color-neutral-500); font-size:12px; font-variant-numeric:tabular-nums; flex-shrink:0; width:5em; text-align:right; }
  .status-dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .status-dot.status-operational{ background:#4ADE80; }
  .status-dot.status-under-construction{ background:#FBBF24; }
  .status-dot.status-planned{ background:#94A3B8; }

  /* Hairline rows, not cards. Boxed entries inside a boxed panel inside a
     boxed rail was three frames deep; the relationship rides above the name as
     its own line so long labels never fight the name for the row. */
  .p-partners{ margin-top:var(--space-8); }
  .partner-list{ list-style:none; margin:0; padding:0; display:grid; gap:0; }
  .partner-card{ border:0; border-radius:0; padding:var(--space-4) 0;
    border-top:1px solid color-mix(in srgb, var(--color-text) 8%, transparent); }
  .partner-card:first-child{ border-top:0; padding-top:0; }
  .partner-top{ display:flex; align-items:baseline; gap:var(--space-3); margin-top:1px; }
  .partner-name{ font:500 14px var(--font-heading); }
  .partner-since{ margin-left:auto; font-size:11px; color:var(--color-neutral-500); font-variant-numeric:tabular-nums; }
  .partner-relationship{ display:block; font:500 10px var(--font-heading); letter-spacing:.09em; text-transform:uppercase; color:var(--color-accent-300); }
  .partner-detail{ margin:.3rem 0 0; font-size:12.5px; color:var(--color-neutral-400); line-height:1.55; max-width:56ch; }
  .partner-meta{ display:block; margin-top:.4rem; font-size:11px; color:var(--color-neutral-500); }
  .partner-meta, .partner-detail, .partner-relationship{ min-width:0; overflow-wrap:break-word; }
  .partner-meta a{ color:var(--color-neutral-500); }
  .partner-meta a:hover{ color:var(--color-accent-300); }
  .empty-note{ color:var(--color-neutral-500); font-size:13px; font-style:italic; }

  .headline-list{ list-style:none; margin:0; padding:0; }
  .headline-item{ padding:var(--space-3) 0; border-top:1px solid color-mix(in srgb, var(--color-text) 7%, transparent); font-size:13px; line-height:1.45; }
  .headline-item:first-child{ border-top:0; }
  .headline-top{ display:flex; align-items:center; gap:var(--space-2); margin-bottom:2px; }
  .headline-date{ font-size:11px; color:var(--color-neutral-500); white-space:nowrap; }
  .headline-category{ font:500 10px var(--font-heading); letter-spacing:.09em; text-transform:uppercase; color:var(--color-neutral-500); }
  .headline-title{ display:block; color:var(--color-text); font-weight:500; }
  .headline-why{ margin:.25rem 0 0; color:var(--color-neutral-400); font-size:12px; line-height:1.5; }
  .headline-meta{ display:block; margin-top:.3rem; font-size:11px; color:var(--color-neutral-500); }
  .headline-meta a{ color:var(--color-neutral-500); }
  .headline-meta a:hover{ color:var(--color-accent-300); }
  .p-search-link{ display:inline-block; margin-top:var(--space-4); font-size:12.5px; }

  /* ---- site page ---- */
  .s-head{ display:flex; align-items:flex-start; gap:var(--space-4); }
  .s-head h1{ font-size:26px; }
  .s-sub{ margin:4px 0 0; color:var(--color-accent-300); font-size:13px; }
  .s-head .provider-tag{ margin-left:auto; flex-shrink:0; }
  .s-facts{ display:flex; flex-wrap:wrap; gap:var(--space-6) var(--space-8);
    padding:var(--space-4) var(--space-6); margin:var(--space-6) 0 var(--space-8);
    background:var(--color-surface); border:1px solid var(--color-divider); border-radius:var(--radius-lg); }
  .fact-label{ font-size:10px; text-transform:uppercase; letter-spacing:.09em; color:var(--color-neutral-500); }
  .fact-value{ margin-top:.3rem; font-size:15px; }
  .fact-muted{ color:var(--color-neutral-500); }
  .s-block{ margin-bottom:var(--space-8); }
  .s-block h2{ font-size:14px; font-weight:600; margin-bottom:var(--space-3); }
  .s-prose{ max-width:70ch; font-size:13.5px; line-height:1.68; color:var(--color-text); white-space:pre-line; }
  .src-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; }
  .src-list li{ display:grid; grid-template-columns:22px 1fr; gap:var(--space-4); align-items:start;
    padding:var(--space-3) 0; border-top:1px solid color-mix(in srgb, var(--color-text) 8%, transparent); font-size:13px; line-height:1.45; }
  .src-list li:first-child{ border-top:0; }
  .src-meta{ margin-top:2px; font-size:11px; color:var(--color-neutral-500); }

  .site-disclosure{ border:1px solid var(--color-divider); border-radius:var(--radius-lg); background:var(--color-surface); }
  .site-disclosure > summary{ display:flex; align-items:center; gap:var(--space-3); padding:var(--space-4); cursor:pointer; list-style:none; font-size:13.5px; font-weight:600; }
  .site-disclosure > summary::-webkit-details-marker{ display:none; }
  .site-disclosure > summary:hover{ color:var(--color-accent-300); }
  .disc-chevron{ color:var(--color-neutral-500); transition:transform .16s ease; display:inline-block; }
  .site-disclosure[open] .disc-chevron{ transform:rotate(90deg); }
  .disc-body{ padding:0 var(--space-4) var(--space-2); border-top:1px solid var(--color-divider); }
  .disc-block{ padding:var(--space-4) 0; border-bottom:1px solid color-mix(in srgb, var(--color-text) 8%, transparent); }
  .disc-block:last-child{ border-bottom:0; }
  .disc-head{ display:flex; align-items:center; gap:var(--space-3); flex-wrap:wrap; }
  .disc-field{ font-size:10.5px; text-transform:uppercase; letter-spacing:.08em; color:var(--color-neutral-500); min-width:5rem; }
  .disc-blurb{ margin:.45rem 0 0; font-size:12.5px; line-height:1.55; color:var(--color-neutral-400); max-width:68ch; }
  .disc-lift{ margin:.5rem 0 0; font-size:12.5px; line-height:1.55; color:var(--color-neutral-400); max-width:68ch; }
  .disc-lift strong{ color:var(--color-text); font-weight:600; }
  .disc-hint{ margin:.55rem 0 0; padding:.5rem .65rem; border-left:2px solid color-mix(in srgb, var(--color-accent) 35%, transparent);
    background:color-mix(in srgb, var(--color-accent) 6%, transparent); border-radius:0 6px 6px 0; font-size:11.5px; line-height:1.5; color:var(--color-neutral-400); max-width:68ch; }
  .verdict-inline{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; }
  .verdict-inline i{ width:3px; height:12px; flex:none; display:block; }
  .verdict-independent{ color:var(--color-accent-300); } .verdict-independent i{ background:var(--color-accent); }
  .verdict-operator{ color:var(--color-neutral-400); } .verdict-operator i{ background:var(--color-neutral-600); }
  .verdict-unsourced{ color:var(--color-neutral-500); } .verdict-unsourced i{ background:repeating-linear-gradient(to bottom, var(--color-neutral-700) 0 2px, transparent 2px 4px); }

  @media (max-width:1100px){
    :root{ --rail-w:232px; --panel-w:430px; }
    #detail{ width:320px; }
  }
  @media (max-width:760px){
    /* The bar carries the masthead again here, so it's two rows tall. */
    :root{ --top-offset:78px; }
    #bar{ flex-wrap:wrap; gap:var(--space-2) var(--space-6); }
    .brand{ display:none; }
    .brand-bar{ display:flex; flex-direction:row; align-items:baseline; flex-basis:100%;
      gap:var(--space-3); font-size:21px; padding:0; margin:0; border-bottom:0; }
    #rail{ display:none; }
    /* No list to slide — the dashboard just takes the screen. */
    #providerPanel{ width:100%; }
    #detail{ width:88%; max-width:340px; }
    .row{ grid-template-columns:10px minmax(120px,1.4fr) 84px minmax(90px,.9fr); }
    .row .place, .row .stat{ display:none; }
    .legend{ display:none; }
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
