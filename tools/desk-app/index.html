<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'none'; connect-src 'none'">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<title>Site Atlas — research desk</title>
<style>
  /* ════════════════════════════════════════════════════════════════════
     Graphite tokens — transcribed from index.html so the desk reads as the
     same product as the atlas. Kept inline for the same reason the atlas
     keeps its own inline: no build step (see CLAUDE.md). If the palette
     moves there, move it here too; these are a copy, not an import.
     ════════════════════════════════════════════════════════════════ */
  :root{
    --color-bg:#131315;
    --color-surface:#19191c;
    --color-surface-2:#0f0f11;
    --color-text:#ebe9e4;
    --color-accent:#e6dfd0;
    --color-divider: rgba(255,255,255,.1);

    --color-neutral-300:#cfccc4; --color-neutral-400:#a3a19b; --color-neutral-500:#86847f;
    --color-neutral-600:#6b6964; --color-neutral-700:#4f4e4a; --color-neutral-800:#38383a;

    --color-accent-300:#f5f1e8; --color-accent-400:#ece5d6;

    --font-heading:"Geist", system-ui, sans-serif;
    --font-body:"Geist", system-ui, sans-serif;

    --space-1:2.8px; --space-2:5.6px; --space-3:8.4px; --space-4:11.2px;
    --space-6:16.8px; --space-8:22.4px;
    --radius-sm:4px; --radius-md:8px; --radius-lg:14px;
  }

  *, *::before, *::after{ box-sizing:border-box; }
  [hidden]{ display:none !important; }
  html, body{ height:100%; }
  body{
    margin:0; overflow:hidden;
    background:var(--color-bg); color:var(--color-text);
    font-family:var(--font-body); font-size:15px; line-height:1.5;
    -webkit-font-smoothing:antialiased;
    display:grid; grid-template-rows:auto 1fr; height:100vh;
  }
  ::selection{ background:color-mix(in srgb, var(--color-accent) 16%, transparent); color:var(--color-text); }
  h1,h2,h3{ font-family:var(--font-heading); font-weight:500; letter-spacing:-0.015em; margin:0; }
  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--color-neutral-800); border-radius:3px; }

  .eyebrow{
    font:500 10.5px/1 var(--font-heading); letter-spacing:.12em;
    text-transform:uppercase; color:var(--color-neutral-500);
  }

  /* ---- top bar — mirrors the atlas bar, minus the map gradient ---- */
  #bar{
    display:flex; align-items:baseline; gap:var(--space-8); position:relative;
    padding:var(--space-6) var(--space-8) var(--space-4);
  }
  #bar::after{
    content:""; position:absolute; left:var(--space-8); right:var(--space-8); bottom:0; height:1px;
    background:linear-gradient(to right, transparent, var(--color-divider) 48px,
                               var(--color-divider) calc(100% - 48px), transparent);
  }
  .brand{
    font-family:var(--font-heading); font-weight:500; font-size:17px;
    letter-spacing:-.01em; white-space:nowrap;
  }
  .brand span{ color:var(--color-neutral-500); font-weight:400; }
  .bar-meta{
    margin-left:auto; display:flex; align-items:baseline; gap:var(--space-4);
    font-size:11.5px; color:var(--color-neutral-500); letter-spacing:.02em; white-space:nowrap;
  }

  /* ---- view toggle, borrowed from the atlas's .seg ---- */
  .seg{ display:inline-flex; overflow:hidden; border:1px solid var(--color-divider); border-radius:var(--radius-sm); }
  .seg button{
    appearance:none; background:none; border:0; cursor:pointer; padding:3px 10px;
    font:500 11px var(--font-heading); letter-spacing:.03em; color:var(--color-neutral-400);
  }
  .seg button + button{ border-left:1px solid var(--color-divider); }
  .seg button[aria-pressed="true"]{ color:var(--color-accent-300); background:color-mix(in srgb, var(--color-accent) 14%, transparent); }
  .seg button:not([aria-pressed="true"]):hover{ color:var(--color-text); }

  #main{ display:grid; grid-template-columns:336px 1fr; min-height:0; }
  /* The roster is one wide column — it's a table of operators, not a pile
     with a reading pane. */
  #main.on-coverage{ grid-template-columns:1fr; }

  /* ---- coverage roster ---- */
  #coverage{ overflow-y:auto; min-height:0; padding:var(--space-8) 40px 60px; }
  #coverage-inner{ max-width:108ch; }
  #coverage h1{ font-size:22px; margin-bottom:var(--space-2); }
  #coverage-sub{ font-size:12.5px; color:var(--color-neutral-500); margin-bottom:var(--space-4); }
  #coverage-lede{ font-size:13px; color:var(--color-neutral-400); max-width:70ch; margin-bottom:var(--space-8); }
  #coverage-warn{
    margin-bottom:var(--space-8); padding:var(--space-4);
    border:1px solid color-mix(in srgb, #FBBF24 45%, transparent); border-radius:var(--radius-md);
    background:color-mix(in srgb, #FBBF24 8%, transparent); color:#FBBF24; font-size:12.5px;
  }

  .op{ border-top:1px solid var(--color-divider); padding:var(--space-8) 0; }
  .op:first-of-type{ border-top:0; }
  .op-head{ display:flex; align-items:baseline; gap:var(--space-3); }
  .op-dot{ width:10px; height:10px; border-radius:50%; flex:none; align-self:center; background:var(--color-neutral-600); }
  .op-name{ font:500 17px var(--font-heading); letter-spacing:-.01em; }
  .op-drift{ font-size:11.5px; color:#FBBF24; }

  .op-nums{ display:flex; flex-wrap:wrap; gap:var(--space-8); margin:var(--space-4) 0 var(--space-3); }
  .op-num b{ display:block; font:500 22px var(--font-heading); font-variant-numeric:tabular-nums; }
  .op-num span{ font-size:10.5px; letter-spacing:.06em; text-transform:uppercase; color:var(--color-neutral-500); }
  .op-num.is-muted b{ color:var(--color-neutral-500); }

  /* tracked vs. still-a-lead, in the same idiom as the atlas's verdict meter */
  .op-meter{ display:flex; height:5px; border-radius:3px; overflow:hidden; margin-bottom:var(--space-2); max-width:560px; background:var(--color-surface); }
  .op-meter i{ display:block; }
  .op-meter i.lead{ background:repeating-linear-gradient(to right, var(--color-neutral-700) 0 3px, transparent 3px 6px); }
  .op-ratio{ font-size:11.5px; color:var(--color-neutral-500); margin-bottom:var(--space-4); }

  .op-empty{ font-size:12.5px; color:var(--color-neutral-500); font-style:italic; max-width:66ch; margin:var(--space-4) 0 0; }

  /* ---- operator tabs ---- */
  /* One tab per operator rather than one long scroll: the roster is read an
     operator at a time, and the counts on the tabs are the only cross-operator
     comparison that was actually being made. */
  #op-tabs{
    display:flex; flex-wrap:wrap; gap:var(--space-2);
    margin:var(--space-6) 0 var(--space-8);
    padding-bottom:var(--space-4); border-bottom:1px solid var(--color-divider);
  }
  .op-tab{
    display:inline-flex; align-items:center; gap:var(--space-3);
    appearance:none; cursor:pointer; padding:var(--space-3) var(--space-4);
    background:none; border:1px solid transparent; border-radius:var(--radius-sm);
    color:var(--color-neutral-400); font:500 12.5px var(--font-heading); letter-spacing:-.005em;
    transition:background .12s ease, color .12s ease;
  }
  .op-tab:hover{ color:var(--color-text); background:color-mix(in srgb, var(--color-text) 5%, transparent); }
  .op-tab[aria-pressed="true"]{
    color:var(--color-text); background:var(--color-surface); border-color:var(--color-divider);
  }
  .op-tab .op-dot{ width:8px; height:8px; }
  .op-tab-n{
    font-variant-numeric:tabular-nums; font-size:11px; color:var(--color-neutral-500);
    padding:1px 5px; border-radius:999px; background:color-mix(in srgb, var(--color-text) 8%, transparent);
  }
  .op-tab[aria-pressed="true"] .op-tab-n{ color:var(--color-accent-300); }

  /* ---- the per-operator table ---- */
  table.cov{
    width:100%; border-collapse:collapse; margin-top:var(--space-6);
    font-size:12.5px; line-height:1.5;
  }
  table.cov thead th{
    text-align:left; padding:0 var(--space-4) var(--space-3) 0;
    font:500 10.5px/1 var(--font-heading); letter-spacing:.12em; text-transform:uppercase;
    color:var(--color-neutral-500); border-bottom:1px solid var(--color-divider); white-space:nowrap;
  }
  table.cov thead th:last-child{ padding-right:0; }
  table.cov td{ padding:var(--space-4) var(--space-4) var(--space-4) 0; vertical-align:top; }
  table.cov td:last-child{ padding-right:0; }
  table.cov tbody tr + tr{ border-top:1px solid color-mix(in srgb, var(--color-text) 7%, transparent); }

  /* A group heading is a row in the same table rather than a separate block,
     so "in the atlas" and "only a lead" stay in one column grid and can be
     read straight down. */
  tr.grp th{
    text-align:left; padding:var(--space-8) 0 var(--space-3);
    font:500 12px var(--font-heading); color:var(--color-text);
  }
  tbody:first-of-type tr.grp th{ padding-top:var(--space-4); }
  .grp-title{ display:block; }
  .grp-note{
    display:block; margin-top:2px; font:400 11.5px var(--font-body);
    color:var(--color-neutral-500); max-width:74ch;
  }

  .c-site{ min-width:200px; }
  .site-name{ display:block; font-weight:500; color:var(--color-text); }
  .site-sub{ display:block; margin-top:2px; color:var(--color-neutral-500); font-size:11.5px; max-width:56ch; }
  .c-status, .c-cap{ white-space:nowrap; color:var(--color-neutral-300); }
  .c-cap{ font-variant-numeric:tabular-nums; }
  /* A lead's status and capacity are read out of its prose, not recorded —
     lighter weight so the table does not imply they are fields. */
  .is-guessed{ color:var(--color-neutral-600); font-style:italic; }
  .derived{
    display:block; margin-top:2px; font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--color-neutral-600); font-style:normal;
  }

  .c-conf{ white-space:nowrap; }
  .conf-dot{
    display:inline-block; width:7px; height:7px; border-radius:50%;
    margin-right:var(--space-3); vertical-align:1px; background:var(--color-neutral-600);
  }
  /* The graded level is the dot; the verdict is the words. Same order of
     priority as the atlas itself — see CLAUDE.md, "lead with the verdict". */
  .conf-dot.is-lead{ background:none; border:1px dashed var(--color-neutral-600); width:8px; height:8px; }
  .conf-word{ color:var(--color-neutral-300); }
  .conf-word.is-lead{ color:var(--color-neutral-600); font-style:italic; }
  tr.is-done .site-name{ color:var(--color-neutral-500); text-decoration:line-through; }

  sup.refs{ margin-left:4px; font-size:10px; line-height:0; }
  sup.refs .ref{ color:var(--color-accent-300); text-decoration:none; }
  sup.refs .ref:hover{ text-decoration:underline; }
  sup.refs .ref-sep{ color:var(--color-neutral-600); }
  .no-ref{
    margin-left:var(--space-3); font-size:10.5px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--color-neutral-600);
  }
  /* An uncited lead is ordinary — the roster often paraphrases one source for
     several of them. An uncited row in the atlas is not, so only that one is
     flagged in the warning colour. */
  tr.is-tracked .no-ref{ color:#E0708A; }

  .srcs{ margin-top:var(--space-8); padding-top:var(--space-6); border-top:1px solid var(--color-divider); }
  .src-list{ margin:var(--space-3) 0 0; padding-left:1.9em; }
  .src-list li{ padding:2px 0; font-size:11.5px; color:var(--color-neutral-500); }
  .src-list li:target{ color:var(--color-text); }
  .src-link{ color:var(--color-neutral-300); text-decoration:none; }
  a.src-link:hover{ color:var(--color-accent-300); text-decoration:underline; }
  .src-link.is-dead{ color:var(--color-neutral-600); font-style:italic; }
  .src-host{ margin-left:var(--space-3); color:var(--color-neutral-600); }

  /* ---- left rail: the pile ---- */
  #rail{
    display:flex; flex-direction:column; min-height:0;
    border-right:1px solid var(--color-divider);
  }
  #search-wrap{ padding:var(--space-6) var(--space-8) var(--space-4); }
  #search{
    width:100%; padding:var(--space-3) var(--space-4);
    background:var(--color-surface-2); color:var(--color-text);
    border:1px solid var(--color-divider); border-radius:var(--radius-sm);
    font:400 13px var(--font-body);
  }
  #search::placeholder{ color:var(--color-neutral-600); }
  #search:focus{ outline:none; border-color:var(--color-accent); }
  #count{ padding:0 var(--space-8) var(--space-3); }
  #list{ overflow-y:auto; flex:1; min-height:0; padding:0 var(--space-8) var(--space-8); }

  /* Row idiom borrowed from .prov in the atlas: a colour chip, a title, and
     a hairline between siblings rather than boxes around each one. */
  .item{
    display:grid; grid-template-columns:8px 1fr; gap:var(--space-2) var(--space-3);
    align-items:start; width:calc(100% + var(--space-4));
    margin:0 calc(var(--space-2) * -1); padding:var(--space-4) var(--space-2);
    border:0; border-radius:6px; background:none; color:inherit;
    text-align:left; font:inherit; cursor:pointer; transition:background .12s ease;
  }
  .item:hover{ background:color-mix(in srgb, var(--color-text) 5%, transparent); }
  .item[aria-current="true"]{ background:color-mix(in srgb, var(--color-accent) 14%, transparent); }
  .item + .item{ border-top:1px solid color-mix(in srgb, var(--color-text) 8%, transparent); }
  .dot{ width:8px; height:8px; border-radius:50%; flex:none; margin-top:6px; }
  .item .topic{ font-weight:500; letter-spacing:-.01em; }
  .item .when{ grid-column:2; font-size:11.5px; color:var(--color-neutral-500); margin-top:-2px; }
  .item .gist{
    grid-column:2; font-size:12.5px; color:var(--color-neutral-500); margin-top:var(--space-2);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }

  /* ---- right: one note ---- */
  #detail{ overflow-y:auto; min-height:0; padding:var(--space-8) 40px 60px; }
  #detail-inner{ max-width:74ch; }
  #topic{ font-size:22px; margin-bottom:var(--space-2); }
  #sub{ font-size:12.5px; color:var(--color-neutral-500); margin-bottom:var(--space-8); }

  .field{ margin-bottom:var(--space-6); }
  .field .eyebrow{ margin-bottom:var(--space-2); }
  #asked{ color:var(--color-neutral-300); font-style:italic; }

  /* The disposition reuses the atlas's verdict-inline idiom: a 3px bar in
     the accent, not a box. It is the one line the user is here to read. */
  .applied-row{ display:flex; gap:var(--space-4); align-items:flex-start; }
  .applied-row i{ width:3px; align-self:stretch; min-height:20px; flex:none; background:var(--color-accent); border-radius:2px; }
  #applied{ font-weight:500; }

  /* Agent prose. Set via textContent and wrapped with pre-wrap — never
     parsed as markdown or HTML, because an agent that reads arbitrary web
     pages wrote it. */
  #body{
    white-space:pre-wrap; margin-top:var(--space-8); padding-top:var(--space-8);
    border-top:1px solid var(--color-divider); color:var(--color-neutral-300);
  }

  #run-wrap{ margin-top:var(--space-8); }
  button.ghost{
    appearance:none; background:none; border:0; cursor:pointer; padding:0;
    font:500 11.5px var(--font-heading); letter-spacing:.02em; color:var(--color-neutral-500);
  }
  button.ghost:hover{ color:var(--color-accent-300); }
  #run{
    white-space:pre-wrap; margin-top:var(--space-4); padding:var(--space-6);
    background:var(--color-surface); border:1px solid var(--color-divider);
    border-radius:var(--radius-lg); color:var(--color-neutral-400);
    font-size:12.5px; line-height:1.55; max-height:460px; overflow-y:auto;
  }

  .empty{ color:var(--color-neutral-500); max-width:60ch; padding-top:var(--space-8); }
  .empty h2{ color:var(--color-text); font-size:17px; margin-bottom:var(--space-4); }
  .empty p{ margin:0 0 var(--space-4); }
  .empty code{
    background:var(--color-surface); border:1px solid var(--color-divider);
    border-radius:var(--radius-sm); padding:1px 6px; font-size:13px; color:var(--color-accent-300);
  }
</style>
</head>
<body>
  <header id="bar">
    <div class="brand">Site Atlas <span>· research desk</span></div>
    <div class="seg" id="viewSeg">
      <button type="button" data-view="notes" aria-pressed="true">Notes</button>
      <button type="button" data-view="coverage" aria-pressed="false">Coverage</button>
    </div>
    <div class="bar-meta">
      <span id="meta-runs"></span>
      <span id="meta-path"></span>
    </div>
  </header>

  <div id="main">
    <aside id="rail">
      <div id="search-wrap">
        <input id="search" type="search" autocomplete="off"
               placeholder="Search topics, impressions, what was applied...">
      </div>
      <div id="count" class="eyebrow"></div>
      <div id="list"></div>
    </aside>

    <section id="detail">
      <div id="detail-inner">
        <div class="empty" id="welcome">
          <h2 id="welcome-title">Nothing on the desk yet</h2>
          <div id="welcome-body"></div>
        </div>

        <article id="note" hidden>
          <h1 id="topic"></h1>
          <div id="sub"></div>

          <div class="field">
            <div class="eyebrow">Asked for</div>
            <div id="asked"></div>
          </div>

          <div class="field">
            <div class="eyebrow">What was done with it</div>
            <div class="applied-row"><i></i><div id="applied"></div></div>
          </div>

          <div id="body"></div>

          <div id="run-wrap" hidden>
            <button class="ghost" id="run-btn">Show the agent's full report</button>
            <div id="run" hidden></div>
          </div>
        </article>
      </div>
    </section>

    <section id="coverage" hidden>
      <div id="coverage-inner">
        <h1>Coverage</h1>
        <div id="coverage-sub"></div>
        <p id="coverage-lede"></p>
        <div id="coverage-warn" hidden></div>
        <div id="op-tabs" role="tablist"></div>
        <div id="coverage-list"></div>
      </div>
    </section>
  </div>

<script src="dev-preview.js"></script>
<script src="renderer.js"></script>
</body>
</html>
